<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 管理后台</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a12;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ff6b6b, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 40px;
        }
        .auth-panel input {
            width: 280px;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #00f0ff;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }
        .auth-panel .msg {
            color: #ff6666;
            font-size: 0.8rem;
            min-height: 20px;
        }
        .btn {
            padding: 10px 30px;
            background: linear-gradient(135deg, #00f0ff, #0080ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn.secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn.small {
            padding: 4px 10px;
            font-size: 0.7rem;
        }
        .btn.danger {
            background: linear-gradient(135deg, #ff4444, #cc0000);
        }
        .btn.success {
            background: linear-gradient(135deg, #44ff44, #00cc00);
        }
        .btn.warning {
            background: linear-gradient(135deg, #ffaa00, #ff6600);
        }
        .panel {
            display: none;
        }
        .panel.active { display: block; }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #00f0ff;
        }
        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        .setting-row label {
            min-width: 80px;
        }
        .setting-row input, .setting-row select {
            padding: 6px 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #fff;
        }
        .toggle-btn {
            padding: 6px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
        }
        .toggle-btn.active {
            background: #00f0ff;
            color: #000;
        }
        .avatar-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 8px 0;
        }
        .avatar-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        .avatar-card img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        .avatar-card .info {
            font-size: 0.6rem;
            color: #888;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            margin: 4px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-size: 0.75rem;
        }
        .user-item.banned { border-left: 3px solid #ff4444; }
        .user-item.normal { border-left: 3px solid #44ff44; }
        .user-info {
            flex: 1;
            overflow: hidden;
        }
        .user-info .ip {
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-info .fp {
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-info .time {
            color: #666;
        }
        .user-status {
            font-weight: bold;
        }
        .user-status.banned { color: #ff6666; }
        .user-status.normal { color: #44ff44; }
        .hidden { display: none !important; }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #00f0ff;
            border-radius: 10px;
            color: #fff;
            z-index: 9999;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #888;
            text-decoration: none;
        }
        .back-link:hover { color: #fff; }
        /* 新增样式 */
        .tab-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #aaa;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .tab-btn.active {
            background: #00f0ff;
            color: #000;
            border-color: #00f0ff;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00f0ff;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
        }
        .log-list {
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.75rem;
            font-family: monospace;
        }
        .log-item {
            padding: 4px 8px;
            margin: 2px 0;
            border-radius: 4px;
            background: rgba(255,255,255,0.03);
        }
        .log-item.warn { border-left: 3px solid #ffaa00; }
        .log-item.error { border-left: 3px solid #ff4444; }
        .log-item.info { border-left: 3px solid #00f0ff; }
        .log-item.success { border-left: 3px solid #44ff44; }
        .data-preview {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.7rem;
            max-height: 200px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .danger-zone {
            border: 1px solid #ff4444;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
        .danger-zone .section-title { color: #ff4444; }
        .export-import {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .export-import textarea {
            width: 100%;
            min-height: 100px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            font-family: monospace;
            font-size: 0.75rem;
        }
        /* 举报管理 */
        .report-item {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px;
            margin: 8px 0;
            border-left: 3px solid #ffaa00;
        }
        .report-item.handled { border-left-color: #44ff44; opacity: 0.75; }
        .report-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.7rem;
            color: #888;
            flex-wrap: wrap;
        }
        .report-status { font-weight: bold; }
        .report-status.pending { color: #ffaa00; }
        .report-status.handled { color: #44ff44; }
        .report-reason {
            background: rgba(255,68,68,0.08);
            border: 1px solid rgba(255,68,68,0.2);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.8rem;
            color: #ffaaaa;
            margin: 8px 0;
            word-break: break-all;
        }
        .report-parties { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
        .report-party {
            flex: 1;
            min-width: 200px;
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 0.7rem;
            color: #aaa;
        }
        .report-party .party-title { font-weight: bold; font-size: 0.78rem; margin-bottom: 4px; }
        .report-party.reporter .party-title { color: #00f0ff; }
        .report-party.reported .party-title { color: #ff6666; }
        .report-party .banned-tag { color: #ff4444; font-weight: bold; }
        .report-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← 返回游戏</a>
    <div class="container">
        <h1>🔐 管理后台</h1>

        <!-- 密码验证 -->
        <div id="auth-panel" class="auth-panel">
            <div style="color:#aaa;font-size:0.9rem;">请输入管理密码</div>
            <input type="password" id="password-input" placeholder="管理密码">
            <div class="msg" id="auth-msg"></div>
            <button class="btn" id="auth-btn">进入后台</button>
        </div>

        <!-- 后台内容 -->
        <div id="main-panel" class="panel">
            <!-- 标签页导航 -->
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="dashboard">📊 仪表盘</button>
                <button class="tab-btn" data-tab="moderation">🛡️ 内容审核</button>
                <button class="tab-btn" data-tab="users">👥 用户管理</button>
                <button class="tab-btn" data-tab="reports">📮 举报管理</button>
                <button class="tab-btn" data-tab="ai-rooms">🤖 AI房间</button>
                <button class="tab-btn" data-tab="settings">⚙️ 系统设置</button>
                <button class="tab-btn" data-tab="logs">📝 日志</button>
                <button class="tab-btn" data-tab="data">💾 数据管理</button>
            </div>

            <!-- 仪表盘 -->
            <div class="tab-content active" id="tab-dashboard">
                <div class="section">
                    <div class="section-title">📊 数据统计</div>
                    <div class="stat-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="stat-total-users">0</div>
                            <div class="stat-label">总用户</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-banned-users">0</div>
                            <div class="stat-label">已封禁</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-pending-avatars">0</div>
                            <div class="stat-label">待审核头像</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-approved-avatars">0</div>
                            <div class="stat-label">已保留头像</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-blocked-avatars">0</div>
                            <div class="stat-label">已违规头像</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-total-games">0</div>
                            <div class="stat-label">总对局数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="stat-pending-reports">0</div>
                            <div class="stat-label">待处理举报</div>
                        </div>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">🎮 游戏状态</div>
                    <div class="setting-row">
                        <label>审核状态：</label>
                        <span id="dash-mod-status">-</span>
                    </div>
                    <div class="setting-row">
                        <label>AI房间总数：</label>
                        <span id="dash-ai-rooms">-</span>
                    </div>
                    <div class="setting-row">
                        <label>存储使用：</label>
                        <span id="dash-storage">-</span>
                    </div>
                </div>
            </div>

            <!-- 内容审核 -->
            <div class="tab-content" id="tab-moderation">
                <div class="section">
                    <div class="section-title">内容审核设置</div>
                    <div class="setting-row">
                        <label>审核开关：</label>
                        <button class="toggle-btn" id="mod-on-btn">开启</button>
                        <button class="toggle-btn" id="mod-off-btn">关闭</button>
                    </div>
                    <div class="setting-row">
                        <label>uapis.cn API Key：</label>
                        <input type="text" id="apikey-input" placeholder="可选，留空则只用yuafeng.cn" style="width:300px;">
                    </div>
                    <div class="setting-row">
                        <label>敏感词库：</label>
                        <button class="btn small" id="edit-words-btn">编辑敏感词</button>
                    </div>
                    <div id="words-editor" class="hidden" style="margin-top:10px;">
                        <textarea id="custom-words-input" placeholder="每行一个敏感词" style="width:100%;min-height:80px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;padding:10px;"></textarea>
                        <button class="btn small" id="save-words-btn">保存敏感词</button>
                    </div>
                </div>

                <!-- 待审核头像 -->
                <div class="section">
                    <div class="section-title" style="color:#ffaa00;">⏳ 待审核头像 (<span id="pending-count">0</span>)</div>
                    <div id="pending-avatars-list" class="avatar-list"></div>
                </div>

                <!-- 已通过头像 -->
                <div class="section">
                    <div class="section-title" style="color:#44ff44;">✅ 已保留头像 (<span id="approved-count">0</span>)</div>
                    <div id="approved-avatars-list" class="avatar-list"></div>
                </div>

                <!-- 已违规头像 -->
                <div class="section">
                    <div class="section-title" style="color:#ff4444;">🚫 已违规头像 (<span id="blocked-count">0</span>)</div>
                    <div id="blocked-avatars-list" class="avatar-list"></div>
                </div>
            </div>

            <!-- 用户管理 -->
            <div class="tab-content" id="tab-users">
                <div class="section">
                    <div class="section-title">👥 用户管理</div>
                    <div class="setting-row">
                        <input type="text" id="user-search" placeholder="搜索IP或指纹..." style="flex:1;">
                        <button class="btn small" id="refresh-users-btn">刷新</button>
                    </div>
                    <div id="user-list-container" style="max-height:400px;overflow-y:auto;"></div>
                </div>
                <div class="section">
                    <div class="section-title">📋 封禁列表</div>
                    <div id="ban-list-container" style="max-height:200px;overflow-y:auto;"></div>
                </div>
            </div>

            <!-- 举报管理 -->
            <div class="tab-content" id="tab-reports">
                <div class="section">
                    <div class="section-title">📮 举报管理（待处理 <span id="reports-pending-count">0</span> 条）</div>
                    <div class="setting-row">
                        <button class="toggle-btn active" id="reports-filter-all">全部</button>
                        <button class="toggle-btn" id="reports-filter-pending">待处理</button>
                        <button class="toggle-btn" id="reports-filter-handled">已处理</button>
                        <button class="btn small" id="refresh-reports-btn" style="margin-left:auto;">刷新</button>
                    </div>
                    <div id="reports-list-container" style="max-height:520px;overflow-y:auto;"></div>
                </div>
            </div>

            <!-- AI房间配置 -->
            <div class="tab-content" id="tab-ai-rooms">
                <div class="section">
                    <div class="section-title">🤖 AI伪装房间配置</div>
                    <div class="setting-row">
                        <label>简单：</label><input type="number" id="ai-room-lv1" value="3" min="0" max="10" style="width:50px;">
                        <label>普通：</label><input type="number" id="ai-room-lv2" value="3" min="0" max="10" style="width:50px;">
                        <label>困难：</label><input type="number" id="ai-room-lv3" value="2" min="0" max="10" style="width:50px;">
                        <label>大师：</label><input type="number" id="ai-room-lv4" value="2" min="0" max="10" style="width:50px;">
                    </div>
                    <button class="btn small" id="save-ai-config-btn">💾 保存AI房间配置</button>
                </div>
                <div class="section">
                    <div class="section-title">🎭 AI行为设置</div>
                    <div class="setting-row">
                        <label>AI聊天回复：</label>
                        <button class="toggle-btn" id="ai-chat-on">开启</button>
                        <button class="toggle-btn" id="ai-chat-off">关闭</button>
                    </div>
                    <div class="setting-row">
                        <label>AI难度波动：</label>
                        <button class="toggle-btn" id="ai-variant-on">开启</button>
                        <button class="toggle-btn" id="ai-variant-off">关闭</button>
                    </div>
                </div>
            </div>

            <!-- 系统设置 -->
            <div class="tab-content" id="tab-settings">
                <div class="section">
                    <div class="section-title">⚙️ 游戏设置</div>
                    <div class="setting-row">
                        <label>默认房间标题：</label>
                        <input type="text" id="default-room-title" value="来和我一起玩吧" maxlength="15" style="width:200px;">
                    </div>
                    <div class="setting-row">
                        <label>最大房间人数：</label>
                        <input type="number" id="max-players" value="2" min="2" max="10" style="width:60px;">
                    </div>
                    <div class="setting-row">
                        <label>游戏音效：</label>
                        <button class="toggle-btn" id="sound-on">开启</button>
                        <button class="toggle-btn" id="sound-off">关闭</button>
                    </div>
                    <div class="setting-row">
                        <label>动画效果：</label>
                        <button class="toggle-btn" id="anim-on">开启</button>
                        <button class="toggle-btn" id="anim-off">关闭</button>
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">🔒 安全设置</div>
                    <div class="setting-row">
                        <label>新管理密码：</label>
                        <input type="password" id="new-password" placeholder="留空则不修改" style="width:200px;">
                    </div>
                    <button class="btn small warning" id="change-password-btn">🔑 修改密码</button>
                </div>
            </div>

            <!-- 日志 -->
            <div class="tab-content" id="tab-logs">
                <div class="section">
                    <div class="section-title">📝 系统日志</div>
                    <div class="setting-row">
                        <button class="btn small" id="clear-logs-btn">清空日志</button>
                        <button class="btn small" id="export-logs-btn">导出日志</button>
                    </div>
                    <div id="log-container" class="log-list"></div>
                </div>
            </div>

            <!-- 数据管理 -->
            <div class="tab-content" id="tab-data">
                <div class="section">
                    <div class="section-title">💾 数据管理</div>
                    <div class="export-import">
                        <button class="btn small" id="export-data-btn">📤 导出所有数据</button>
                        <button class="btn small" id="import-data-btn">📥 导入数据</button>
                    </div>
                    <textarea id="data-textarea" placeholder="导出的数据将显示在这里，或粘贴要导入的数据"></textarea>
                    <div class="data-preview" id="data-preview"></div>
                </div>
                <div class="danger-zone">
                    <div class="section-title">⚠️ 危险操作</div>
                    <div class="setting-row">
                        <button class="btn danger" id="reset-all-btn">🗑️ 重置所有数据</button>
                        <span style="color:#ff6666;font-size:0.75rem;">将清空所有用户数据、审核记录、封禁列表</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 工具函数 ==========
        const $ = id => document.getElementById(id);

        async function sha256(str){
            // crypto.subtle 仅在安全上下文(https/localhost/file)可用；http 环境下用纯JS实现兜底
            if(window.crypto && crypto.subtle && crypto.subtle.digest){
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
                return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
            }
            return sha256Fallback(str);
        }
        // 纯JS SHA-256（兜底，不依赖安全上下文）
        function sha256Fallback(ascii){
            function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
            const maxWord = Math.pow(2,32);
            let result = '';
            const words = [];
            const asciiBitLength = ascii.length*8;
            let hash = sha256Fallback.h = sha256Fallback.h || [];
            const k = sha256Fallback.k = sha256Fallback.k || [];
            let primeCounter = k.length;
            const isComposite = {};
            for(let candidate=2; primeCounter<64; candidate++){
                if(!isComposite[candidate]){
                    for(let i=0; i<313; i+=candidate) isComposite[i]=candidate;
                    hash[primeCounter]=(Math.pow(candidate,0.5)*maxWord)|0;
                    k[primeCounter++]=(Math.pow(candidate,1/3)*maxWord)|0;
                }
            }
            ascii += '\x80';
            while(ascii.length%64-56) ascii += '\x00';
            for(let i=0; i<ascii.length; i++){
                const j = ascii.charCodeAt(i);
                if(j>>8) return '';
                words[i>>2] |= j << ((3-i)%4)*8;
            }
            words[words.length] = (asciiBitLength/maxWord)|0;
            words[words.length] = asciiBitLength;
            hash = hash.slice(0,8);
            for(let j=0; j<words.length;){
                const w = words.slice(j, j+=16);
                const oldHash = hash.slice(0);
                for(let i=0; i<64; i++){
                    const w15 = w[i-15], w2 = w[i-2];
                    const a = hash[0], e = hash[4];
                    const temp1 = hash[7]
                        + (rr(e,6)^rr(e,11)^rr(e,25))
                        + ((e&hash[5])^((~e)&hash[6]))
                        + k[i]
                        + (w[i] = (i<16) ? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
                    const temp2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
                    hash = [(temp1+temp2)|0].concat(hash);
                    hash[4] = (hash[4]+temp1)|0;
                }
                for(let i=0; i<8; i++) hash[i] = (hash[i]+oldHash[i])|0;
            }
            for(let i=0; i<8; i++){
                for(let j=3; j+1; j--){
                    const b = (hash[i]>>(j*8))&255;
                    result += ((b<16)?'0':'') + b.toString(16);
                }
            }
            return result;
        }

        function makePartyCard(title, party, kind){
            const card = document.createElement('div');
            card.className = 'report-party ' + kind;
            const banned = isFpBanned(party.fingerprint);
            card.innerHTML = '<div class="party-title">' + title + '：' + escapeHtml(party.name || '未知') +
                (banned ? ' <span class="banned-tag">[已封禁]</span>' : '') + '</div>' +
                '<div>指纹: ' + escapeHtml(party.fingerprint || 'unknown') + '</div>' +
                '<div style="color:#666;">IP: ' + escapeHtml(party.ip || 'unknown') + '</div>';
            return card;
        }

        function banFromReport(report, who){
            const party = (who === 'reported' ? report.reported : report.reporter) || {};
            const fp = party.fingerprint;
            if(!fp || fp === 'unknown'){
                showToast('❌ 该用户指纹未知，无法封禁');
                return;
            }
            if(isFpBanned(fp)){
                showToast('⚠️ 该用户已在封禁列表中');
                return;
            }
            const defaultReason = who === 'reported' ? ('被举报：' + (report.reason || '违规行为')) : '恶意举报';
            const reason = prompt('请输入封禁原因（将展示给被封禁用户）：', defaultReason);
            if(reason === null) return;

            banData.bannedFingerprints.push(fp);
            if(party.ip && party.ip !== 'unknown' && party.ip !== '未知') banData.bannedIPs.push(party.ip);
            banData.banReasons[fp] = { reason: reason || defaultReason, time: new Date().toLocaleString() };
            saveBanData();

            // 封禁后自动将该举报标记为已处理
            const all = loadReports();
            const r = all.find(x => x.id === report.id);
            if(r){ r.status = 'handled'; saveReports(all); }

            addLog('warn', '管理员封禁' + (who === 'reported' ? '被举报人' : '举报人') + '：' + (party.name || '未知') + ' (' + fp + ')，原因：' + (reason || defaultReason));
            showToast('🚫 已封禁 ' + (party.name || '该用户'));
            renderReports();
            renderUserList();
            renderBanList();
        }

        // 筛选按钮
        [['reports-filter-all','all'],['reports-filter-pending','pending'],['reports-filter-handled','handled']].forEach(pair => {
            $(pair[0]).addEventListener('click', () => {
                reportsFilter = pair[1];
                ['reports-filter-all','reports-filter-pending','reports-filter-handled'].forEach(id => $(id).classList.remove('active'));
                $(pair[0]).classList.add('active');
                renderReports();
            });
        });
        $('refresh-reports-btn').addEventListener('click', () => {
            renderReports();
            showToast('✅ 举报列表已刷新');
        });

        // ========== 系统设置 ==========
        function loadAdminSettings(){
            const s = loadJSON(STORAGE_KEYS.settings, {});
            if(s.defaultRoomTitle) $('default-room-title').value = s.defaultRoomTitle;
            if(s.maxPlayers) $('max-players').value = s.maxPlayers;
            // 音效和动画开关状态
            const soundOn = s.soundEnabled !== false;
            const animOn = s.animEnabled !== false;
            $('sound-on').classList.toggle('active', soundOn);
            $('sound-off').classList.toggle('active', !soundOn);
            $('anim-on').classList.toggle('active', animOn);
            $('anim-off').classList.toggle('active', !animOn);
        }

        $('sound-on').addEventListener('click', () => {
            const s = loadJSON(STORAGE_KEYS.settings, {});
            s.soundEnabled = true;
            saveJSON(STORAGE_KEYS.settings, s);
            $('sound-on').classList.add('active');
            $('sound-off').classList.remove('active');
            showToast('✅ 音效已开启');
        });
        $('sound-off').addEventListener('click', () => {
            const s = loadJSON(STORAGE_KEYS.settings, {});
            s.soundEnabled = false;
            saveJSON(STORAGE_KEYS.settings, s);
            $('sound-off').classList.add('active');
            $('sound-on').classList.remove('active');
            showToast('✅ 音效已关闭');
        });
        $('anim-on').addEventListener('click', () => {
            const s = loadJSON(STORAGE_KEYS.settings, {});
            s.animEnabled = true;
            saveJSON(STORAGE_KEYS.settings, s);
            $('anim-on').classList.add('active');
            $('anim-off').classList.remove('active');
            showToast('✅ 动画已开启');
        });
        $('anim-off').addEventListener('click', () => {
            const s = loadJSON(STORAGE_KEYS.settings, {});
            s.animEnabled = false;
            saveJSON(STORAGE_KEYS.settings, s);
            $('anim-off').classList.add('active');
            $('anim-on').classList.remove('active');
            showToast('✅ 动画已关闭');
        });

        $('change-password-btn').addEventListener('click', async () => {
            const newPwd = $('new-password').value.trim();
            if(!newPwd){
                showToast('❌ 请输入新密码');
                return;
            }
            if(newPwd.length < 6){
                showToast('❌ 密码至少6位');
                return;
            }
            const hash = await sha256(newPwd);
            const s = loadJSON(STORAGE_KEYS.settings, {});
            s.passwordHash = hash;
            saveJSON(STORAGE_KEYS.settings, s);
            ADMIN_PASSWORD_HASH = hash;
            $('new-password').value = '';
            showToast('✅ 密码已修改');
            addLog('success', '管理密码已修改');
        });

        // ========== 数据管理 ==========
        $('export-data-btn').addEventListener('click', () => {
            const allData = {};
            for(let key in localStorage){
                if(key.startsWith('bomb_')){
                    allData[key] = loadJSON(key, null);
                }
            }
            $('data-textarea').value = JSON.stringify(allData, null, 2);
            $('data-preview').textContent = '共 ' + Object.keys(allData).length + ' 个数据项';
            showToast('✅ 数据已导出到文本框');
        });

        $('import-data-btn').addEventListener('click', () => {
            const text = $('data-textarea').value.trim();
            if(!text){
                showToast('❌ 请先粘贴要导入的数据');
                return;
            }
            try{
                const data = JSON.parse(text);
                for(let key in data){
                    if(key.startsWith('bomb_')){
                        saveJSON(key, data[key]);
                    }
                }
                showToast('✅ 数据导入成功');
                addLog('success', '数据已导入');
                loadAllData();
                renderDashboard();
            }catch(e){
                showToast('❌ 数据格式错误');
                addLog('error', '数据导入失败：' + e.message);
            }
        });

        $('reset-all-btn').addEventListener('click', () => {
            if(!confirm('⚠️ 确定要重置所有数据吗？此操作不可恢复！')) return;
            if(!confirm('再次确认：将清空所有用户数据、审核记录、封禁列表')) return;

            const keys = [];
            for(let key in localStorage){
                if(key.startsWith('bomb_')) keys.push(key);
            }
            keys.forEach(k => localStorage.removeItem(k));
            showToast('✅ 所有数据已重置');
            addLog('warn', '所有数据已重置');
            loadAllData();
            renderDashboard();
        });

        // ========== 初始化 ==========
        loadPasswordHash();
    </script>
</body>
</html>
