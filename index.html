    } else if(G.mode.includes('ai')&&G.currentPlayer==='p2') setTimeout(aiTurn, 900);
    if(Privacy.isLocal()) setKeypadEnabled(true);
    syncIfRemote();
}

// ========== 技能选择流程 ==========
function startRoundSkillSelect(){
    if(!G.isSkillMode||!G.active){ startNewRound(); return; }
    G.processing=true;
    setKeypadEnabled(false);
    const skillCount = G.skillCount || 1;
    if(G.mode.includes('remote')){
        if(G.isHost){
            G.pendingSkillSelect = 'p1';
            G.pendingSkillCount = skillCount;
            G.pendingRoundOptions = [];
            for(let i=0; i<skillCount; i++){
                G.pendingRoundOptions.push(...getRandomSkills(3).map(s=>s.id));
            }
            G.pendingSkillOptions = G.pendingRoundOptions;
            syncIfRemote();
            showSkillSelectWithCallback('p1', skillCount, function(){
                G.pendingSkillSelect = 'p2';
                G.pendingSkillCount = skillCount;
                G.pendingRoundOptions = [];
                for(let i=0; i<skillCount; i++){
                    G.pendingRoundOptions.push(...getRandomSkills(3).map(s=>s.id));
                }
                G.pendingSkillOptions = G.pendingRoundOptions;
                messageDisplay.textContent='⏳ 等待对方选择技能...';
                syncIfRemote();
                G.hostSkillComplete = function(){
                    G.pendingSkillSelect = null;
                    G.pendingSkillCount = null;
                    startNewRound();
                };
                startHostTimeout('p2', G.hostSkillComplete);
            });
        } else {
            G.pendingSkillSelect = 'p2';
            setKeypadEnabled(false);
            messageDisplay.textContent='⏳ 等待你选择技能...';
        }
    } else {
        const first=G.currentPlayer;
        const second=getOpponentPlayer(first).id;
        skillSelectPhase=first;
        triggerSkillSelectForPlayer(first, skillCount, function(){
            if(!G.active) return;
            skillSelectPhase=second;
            triggerSkillSelectForPlayer(second, skillCount, function(){
                skillSelectPhase=null;
                startNewRound();
            });
        });
    }
}

function triggerSkillSelectForPlayer(playerId, skillCount, onComplete){
    if(!G.active){ onComplete(); return; }
    if(G.mode.includes('ai')&&playerId==='p2') aiSelectSkillWithCallback(skillCount, onComplete);
    else showSkillSelectWithCallback(playerId, skillCount, onComplete);
}

function showSkillSelectWithCallback(forPlayerId, skillCount, onComplete){
    const player=getPlayer(forPlayerId);
    const selectedSkills = [];
    let currentRound = 0;
    let done = false;
    let preGeneratedOptions = [];

    if(G.mode.includes('remote')&&G.isHost){
        G.pendingSkillSelect = forPlayerId;
        G.pendingSkillCount = skillCount;
        if(!G.pendingRoundOptions){
            G.pendingRoundOptions = [];
            for(let i=0; i<skillCount; i++){
                G.pendingRoundOptions.push(...getRandomSkills(3).map(s=>s.id));
            }
        }
        preGeneratedOptions = G.pendingRoundOptions;
        G.pendingSkillOptions = preGeneratedOptions;
        syncIfRemote();
    }

    function actuallyShow(){
        done = false;
        currentRound = 0;
        selectedSkills.length = 0;
        if(G.mode.includes('remote')&&G.isHost) preGeneratedOptions = G.pendingRoundOptions || [];
        showRound();
    }

    function showRound(){
        if(done) return;
        if(selectedSkills.length >= skillCount){ completeSelection(); return; }
        currentRound++;
        let finalOptions;
        if(G.mode.includes('remote')&&G.isHost && preGeneratedOptions.length > 0){
            const startIdx = (currentRound - 1) * 3;
            const roundOptionIds = preGeneratedOptions.slice(startIdx, startIdx + 3);
            finalOptions = roundOptionIds.map(id=>getSkillById(id)).filter(s=>s);
            if(finalOptions.length === 0) finalOptions = getRandomSkills(3);
        } else {
            let roundOptions = getRandomSkills(3);
            let filtered = roundOptions.filter(s => !selectedSkills.some(sel => sel.id === s.id));
            while(filtered.length === 0){
                roundOptions = getRandomSkills(3);
                filtered = roundOptions.filter(s => !selectedSkills.some(sel => sel.id === s.id));
            }
            finalOptions = filtered;
        }

        skillSelectGrid.innerHTML = '';
        skillSelectTitle.textContent = player.name + ' 选择技能 (' + selectedSkills.length + '/' + skillCount + ')';

        finalOptions.forEach(skill => {
            const card = document.createElement('div');
            card.className = 'skill-select-card';
            card.innerHTML = '<div class="skill-icon">'+skill.name.split(' ')[0]+'</div>'+
                '<div class="skill-name">'+skill.name+'</div>'+
                '<div class="skill-desc">'+skill.desc+'</div>';
            card.addEventListener('click', function(){
                if(done) return;
                selectedSkills.push(skill);
                showRound();
            });
            skillSelectGrid.appendChild(card);
        });

        skillSelectOverlay.classList.add('active');
        G.processing = true;
        setKeypadEnabled(false);

        G.skillTimerCount = 30;
        skillTimerEl.textContent = G.skillTimerCount;
        clearSkillTimer();
        G.skillTimer = setInterval(function(){
            G.skillTimerCount--;
            skillTimerEl.textContent = G.skillTimerCount;
            if(G.skillTimerCount <= 0){
                clearSkillTimer();
                const randomSkill = finalOptions[Math.floor(Math.random() * finalOptions.length)];
                selectedSkills.push(randomSkill);
                showRound();
            }
        }, 1000);
    }

    function completeSelection(){
        if(done) return;
        done = true;
        clearSkillTimer();
        clearHostTimeout();
        player.skills = [...selectedSkills];
        player.cooldowns = {};
        skillSelectOverlay.classList.remove('active');
        Privacy.hide();
        renderSkills();
        updateTurnIndicator();
        if(Privacy.isLocal()){
            const skillNames = selectedSkills.map(s=>s.name).join('、');
            Privacy.showSecret(player.name, '你选择了', skillNames, function(){ if(onComplete) onComplete(); });
        } else {
            if(onComplete) onComplete();
        }
    }

    if(Privacy.isLocal()) Privacy.confirmTurn(player.name + '（选择技能）', actuallyShow);
    else actuallyShow();
}

function aiSelectSkillWithCallback(skillCount, onComplete){
    const selectedSkills = [];
    for(let i=0; i<skillCount; i++){
        let options = getRandomSkills(3).filter(s => !selectedSkills.some(sel => sel.id === s.id));
        while(options.length === 0){
            options = getRandomSkills(3).filter(s => !selectedSkills.some(sel => sel.id === s.id));
        }
        const skill = options[Math.floor(Math.random()*options.length)];
        selectedSkills.push(skill);
    }
    getPlayer('p2').skills = [...selectedSkills];
    getPlayer('p2').cooldowns = {};
    G.processing = true;
    messageDisplay.textContent = '🤖 AI 已选择技能';
    setTimeout(function(){
        if(!G.active){ if(onComplete) onComplete(); return; }
        renderSkills();
        if(onComplete) onComplete();
    }, 900);
}

function startHostTimeout(playerId, onComplete){
    clearHostTimeout();
    G.hostTimeout=setTimeout(function(){
        if(G.active&&G.pendingSkillSelect===playerId&&G.isHost){
            const player=getPlayer(playerId);
            const selectedSkills = [];
            for(let i=0; i<G.pendingSkillCount; i++) selectedSkills.push(getRandomSkills(1)[0]);
            player.skills = [...selectedSkills];
            player.cooldowns = {};
            skillSelectOverlay.classList.remove('active');
            Privacy.hide();
            clearSkillTimer();
            G.pendingSkillSelect = null;
            G.pendingSkillCount = null;
            G.pendingRoundOptions = null;
            G.pendingSkillOptions = null;
            const cb = G.hostSkillComplete;
            G.hostSkillComplete = null;
            messageDisplay.textContent = player.name + ' 超时，自动选择了技能';
            renderSkills();
            syncIfRemote();
            if(cb) cb();
        }
    }, 35000);
}

function showSkillSelectWithOptions(forPlayerId, optionIds, skillCount){
    const player = getPlayer(forPlayerId);
    const selectedSkills = [];
    const count = skillCount || 1;
    let currentRound = 0;
    let done = false;
    optionIds = optionIds || [];

    function showRound(){
        if(done) return;
        if(selectedSkills.length >= count){ completeSelection(); return; }
        currentRound++;
        const startIdx = (currentRound - 1) * 3;
        const roundOptionIds = optionIds.slice(startIdx, startIdx + 3);
        let roundOptions = roundOptionIds.map(id=>getSkillById(id)).filter(s=>s);
        if(roundOptions.length === 0) roundOptions = getRandomSkills(3);
        roundOptions = roundOptions.filter(s => !selectedSkills.some(sel => sel.id === s.id));
        if(roundOptions.length === 0){
            let newOptions = getRandomSkills(3);
            while(newOptions.some(s => selectedSkills.some(sel => sel.id === s.id))){
                newOptions = getRandomSkills(3);
            }
            roundOptions = newOptions;
        }

        skillSelectGrid.innerHTML = '';
        skillSelectTitle.textContent = player.name + ' 选择技能 (' + selectedSkills.length + '/' + count + ')';

        roundOptions.forEach(skill => {
            const card = document.createElement('div');
            card.className = 'skill-select-card';
            card.innerHTML = '<div class="skill-icon">'+skill.name.split(' ')[0]+'</div>'+
                '<div class="skill-name">'+skill.name+'</div>'+
                '<div class="skill-desc">'+skill.desc+'</div>';
            card.addEventListener('click', function(){
                if(done) return;
                selectedSkills.push(skill);
                showRound();
            });
            skillSelectGrid.appendChild(card);
        });

        skillSelectOverlay.classList.add('active');
        G.processing = true;
        setKeypadEnabled(false);

        G.skillTimerCount = 30;
        skillTimerEl.textContent = G.skillTimerCount;
        clearSkillTimer();
        G.skillTimer = setInterval(function(){
            G.skillTimerCount--;
            skillTimerEl.textContent = G.skillTimerCount;
            if(G.skillTimerCount <= 0){
                clearSkillTimer();
                const randomSkill = roundOptions[Math.floor(Math.random() * roundOptions.length)];
                selectedSkills.push(randomSkill);
                showRound();
            }
        }, 1000);
    }

    function completeSelection(){
        if(done) return;
        done = true;
        clearSkillTimer();
        if(G.conn) G.conn.send({type:'action', action:'skill_select', playerId:forPlayerId, skillIds:selectedSkills.map(s=>s.id)});
        player.skills = [...selectedSkills];
        player.cooldowns = {};
        skillSelectOverlay.classList.remove('active');
        Privacy.hide();
        G.pendingSkillSelect = null;
        G.pendingSkillCount = null;
        G.pendingRoundOptions = null;
        G.skillSelectShown = false;
        renderSkills();
        G.processing = true;
        setKeypadEnabled(false);
        messageDisplay.textContent = '已选择 '+count+' 个技能，等待同步...';
    }

    showRound();
}

// ========== 核心游戏逻辑：猜测处理（修复陷阱伤害目标） ==========
function processGuess(guess, isSkillAttack, guesserId){
    if(!G.active||G.processing) return;
    const guesser=guesserId?getPlayer(guesserId):getCurrentPlayer();
    const defender=getOpponentPlayer(guesser.id);
    if(!isSkillAttack){
        if(isNaN(guess)||guess<G.low||guess>G.high){
            if(guesser.blind) messageDisplay.textContent='⚠️ 输入无效，请重新输入';
            else messageDisplay.textContent='⚠️ 请输入 '+G.low+'~'+G.high+' 之间的数字';
            G.playerInput=''; updateInputDisplay();
            if(!(G.mode.includes('ai')&&guesser.id==='p2')) setKeypadEnabled(isMyTurn()&&!G.processing);
            return;
        }
    }

    let isHit=(guess===G.bombNumber)||isSkillAttack;
    let selfInflicted = false; // 是否因陷阱/虚张声势导致自己受伤
    if(!isHit && defender.trappedNumber !== null && guess === defender.trappedNumber){
        isHit = true;
        selfInflicted = true;
    }
    if(!isHit && defender.bluffNumber !== null && guess === defender.bluffNumber){
        isHit = true;
        selfInflicted = true;
    }
    if(!isHit && defender.web){
        const dist = Math.abs(guess - G.bombNumber);
        if(dist <= 3 && dist > 0) isHit = true;
    }

    // 冰封效果：猜中不爆炸，切换回合
    if(isHit && defender.frozen && !selfInflicted){
        defender.frozen = false;
        messageDisplay.textContent = '🧊 炸弹被冰封，无法引爆！';
        G.playerInput='';
        updateInputDisplay();
        G.processing=false;
        renderSkills();
        updateTurnIndicator();
        switchTurn();
        syncIfRemote();
        return;
    }

    // 伪装效果：猜中伪装数字，揭露伪装，切换回合（仅正常炸弹命中，非陷阱/虚张声势）
    if(isHit && defender.disguise && G.bombNumber !== guess && !selfInflicted){
        defender.disguise = false;
        defender.disguiseNumber = null;
        messageDisplay.textContent = '🎭 伪装被识破！炸弹真实位置恢复';
        G.playerInput='';
        updateInputDisplay();
        G.processing=false;
        renderSkills();
        updateTurnIndicator();
        switchTurn();
        syncIfRemote();
        return;
    }

    let guesserName;
    if(Privacy.isLocal()) guesserName=guesser.name;
    else guesserName=guesser.id===getMyPlayer().id?'我':(G.mode.includes('ai')&&guesser.id==='p2'?'AI':'对方');
    if(selfInflicted){
        messageDisplay.textContent='💥 '+guesserName+' 触发了对手的陷阱！';
    } else {
        messageDisplay.textContent=isSkillAttack?guesserName+' 使用了自爆！':guesserName+' 猜了 '+guess;
    }
    G.processing=true;
    setKeypadEnabled(false);
    const delay=Privacy.isLocal()?800:500;

    G.prevLow = G.low;
    G.prevHigh = G.high;

    setTimeout(function(){
        if(!G.active) return;
        if(isHit){
            let damage=1;
            if(!selfInflicted){
                // 正常命中：伤害由攻击者技能加成
                if(guesser.double) { damage *= 2; guesser.double=false; }
                if(guesser.allin) { damage *= 3; guesser.allin=false; }
                if(guesser.anger) {
                    const lost = guesser.maxHP - guesser.hp;
                    damage += Math.floor(lost / 2);
                }
                if(guesser.bomblet) { damage += 2; guesser.bomblet=false; }
                if(defender.heat && (guess === G.low || guess === G.high)) { damage += 1; defender.heat=false; }
                if(defender.dormant) { defender.dormant=false; damage += 2; }
            }

            if(selfInflicted){
                // 自己触发陷阱：伤害直接作用于自己，忽略自身攻击加成，但可受自己护盾、重生影响
                if(guesser.shield){
                    guesser.shield=false;
                    messageDisplay.textContent='🛡️ '+guesserName+' 的护盾抵挡了陷阱伤害！';
                } else {
                    guesser.hp-=1;
                    messageDisplay.textContent='💥 '+guesserName+' 被自己的陷阱炸伤！-1血';
                    if(guesser.rebirth && guesser.hp<=0){
                        guesser.hp=2; guesser.rebirth=false;
                        messageDisplay.textContent+=' 🕊️ 重生！以2血复活';
                    }
                }
                // 清除陷阱和虚张声势标记，防止重复触发
                defender.trappedNumber = null;
                defender.bluffNumber = null;
                renderPlayers();
                guesser.pierce=false;
                if(getPlayer('p1').hp<=0||getPlayer('p2').hp<=0){ endGame(); return; }
                // 延迟进入下一阶段，让玩家看到爆炸消息
                setTimeout(function(){
                    afterHitSkillPhase();
                }, 600);
                return;
            }

            // 正常命中或攻击者主动引发（自爆等）：检查防御方护盾、反射
            if(defender.reflect && !isSkillAttack){
                defender.reflect=false;
                if(guesser.shield){
                    guesser.shield=false;
                    messageDisplay.textContent='🪞 反射！但 '+guesserName+' 的护盾抵挡了伤害';
                } else {
                    guesser.hp-=damage;
                    messageDisplay.textContent='🪞 伤害被反射！'+guesserName+' -'+damage+'血';
                    if(guesser.rebirth && guesser.hp<=0){
                        guesser.hp=2; guesser.rebirth=false;
                        messageDisplay.textContent+=' 🕊️ 重生！以2血复活';
                    }
                }
                renderPlayers();
                guesser.pierce=false;
                if(getPlayer('p1').hp<=0||getPlayer('p2').hp<=0){ endGame(); return; }
                setTimeout(function(){
                    afterHitSkillPhase();
                }, 600);
                return;
            }
            if(defender.shield && !guesser.pierce){
                defender.shield=false;
                messageDisplay.textContent='🛡️ '+defender.name+' 的护盾抵挡了伤害！';
            } else {
                defender.hp-=damage;
                if(guesser.lifesteal){ guesser.hp=Math.min(guesser.maxHP,guesser.hp+1); guesser.lifesteal=false; }
                if(defender.rebirth&&defender.hp<=0){
                    defender.hp=2; defender.rebirth=false;
                    messageDisplay.textContent='🕊️ '+defender.name+' 重生！以2血复活';
                } else if(defender.hp > 0){
                    const targetArea = Privacy.isLocal() ? (defender.id===G.currentPlayer?'me':'opponent') : (defender.id===getMyPlayer().id?'me':'opponent');
                    showExplosion(targetArea);
                    messageDisplay.textContent='💥 炸弹爆炸了！'+defender.name+' -'+damage+'血';
                }
            }
            guesser.pierce=false;
            defender.trappedNumber=null;
            defender.bluffNumber=null;
            defender.lock=false; defender.lockedSkill=null;
            renderPlayers();
            if(getPlayer('p1').hp<=0||getPlayer('p2').hp<=0){ endGame(); return; }
            setTimeout(function(){
                afterHitSkillPhase();
            }, 600);
        } else {
            let feedbackCorrect = true;
            if(defender.fog){
                defender.fog=false;
                feedbackCorrect = false;
            }
            if(defender.lie){
                defender.lie=false;
                if(Math.random()<0.5) feedbackCorrect = !feedbackCorrect;
            }
            let highLow = guess < G.bombNumber ? '大' : '小';
            if(!feedbackCorrect) highLow = highLow === '大' ? '小' : '大';
            if(guess<G.bombNumber){ if(feedbackCorrect){ G.low=guess+1; } else { G.high=guess-1; } }
            else { if(feedbackCorrect){ G.high=guess-1; } else { G.low=guess+1; } }
            if(defender.slow){
                defender.slow=false;
                G.low = G.prevLow;
                G.high = G.prevHigh;
                messageDisplay.textContent='🐌 缓速！范围未缩小';
            } else {
                updateRange();
            }
            messageDisplay.textContent = '📉 炸弹比 '+guess+' '+highLow;
            G.playerInput=''; updateInputDisplay();
            if(guesser.allin){
                guesser.allin=false;
                if(guesser.shield){
                    guesser.shield=false;
                    messageDisplay.textContent+=' 🛡️ 护盾抵挡自伤';
                } else {
                    guesser.hp-=1;
                    messageDisplay.textContent+=' 💥 孤注一掷落空，自己-1血！';
                    renderPlayers();
                    if(guesser.hp<=0){
                        if(guesser.rebirth){
                            guesser.hp=2; guesser.rebirth=false;
                            messageDisplay.textContent='🕊️ 重生触发！以2血复活';
                            renderPlayers();
                        } else { endGame(); return; }
                    }
                }
            }
            if(guesser.bet){
                guesser.bet=false;
                if(Math.random()<0.5){
                    guesser.hp=Math.min(guesser.maxHP,guesser.hp+1);
                    messageDisplay.textContent+=' 🎯 押注成功！+1血';
                } else {
                    guesser.hp=Math.max(0,guesser.hp-1);
                    messageDisplay.textContent+=' 🎯 押注失败！-1血';
                    renderPlayers();
                    if(guesser.hp<=0){
                        if(guesser.rebirth){
                            guesser.hp=2; guesser.rebirth=false;
                            messageDisplay.textContent='🕊️ 重生触发！以2血复活';
                            renderPlayers();
                        } else { endGame(); return; }
                    }
                }
            }
            if(guesser.speed){
                guesser.speed=false;
                messageDisplay.textContent+='（🏃加速：可再猜一次）';
                G.processing=false;
                renderSkills();
                if(G.mode.includes('ai')&&guesser.id==='p2'){
                    setKeypadEnabled(false);
                    setTimeout(aiGuess, 900);
                } else {
                    setKeypadEnabled(isMyTurn()&&!G.processing);
                }
                syncIfRemote();
                return;
            }
            switchTurn();
        }
    },delay);
}

function afterHitSkillPhase(){
    if(G.isSkillMode&&!(G.mode.includes('remote')&&!G.isHost)) startRoundSkillSelect();
    else if(!G.isSkillMode) startNewRound();
}

function switchTurn(){
    const current=getCurrentPlayer();
    const opponent=getOpponentPlayer(current.id);
    current.blind=false; current.pierce=false; current.speed=false;
    current.shield=false; current.reflect=false;
    current.fog=false; current.lie=false; current.illusion=false;
    current.heat=false; current.frozen=false;
    G.playerInput=''; updateInputDisplay();

    function doSwitch(){
        if(opponent.skipNext){
            opponent.skipNext=false; opponent.blind=false;
            reduceCooldowns(opponent.id);
            messageDisplay.textContent='🕐 '+opponent.name+' 被暂停，跳过回合！';
            G.processing=false;
            G.playerInput=''; updateInputDisplay();
            renderSkills(); updateTurnIndicator();
            if(G.mode.includes('ai')&&G.currentPlayer==='p2') setTimeout(aiTurn, 900);
            syncIfRemote();
            return;
        }
        G.currentPlayer=opponent.id;
        G.processing=false;
        opponent.skillUsedThisTurn = false;
        if(G.tideShrinkNext){
            G.low = Math.max(G.low, G.low+5);
            G.high = Math.min(G.high, G.high-5);
            G.tideShrinkNext=false;
            updateRange();
        }
        reduceCooldowns(opponent.id);
        renderSkills(); updateTurnIndicator(); updateRange();
        if(G.mode.includes('ai')&&G.currentPlayer==='p2') setTimeout(aiTurn, 900);
        syncIfRemote();
    }

    if(Privacy.isLocal()) Privacy.confirmTurn(opponent.name, doSwitch);
    else doSwitch();
}

// ========== 技能使用（修复远程Guest发送请求、AI数字输入等） ==========
function useSkill(skillId, playerId, ignoreChecks, copyDepth){
    if(!G.active||G.processing) return;
    copyDepth = copyDepth || 0;
    if(copyDepth > 3) return;

    const user=playerId?getPlayer(playerId):(Privacy.isLocal()?getCurrentPlayer():getMyPlayer());
    if(user.id!==G.currentPlayer) return;
    const skill=getSkillById(skillId);
    if(!skill) return;

    // 检查技能是否可用（对于非ignoreChecks）
    if(!ignoreChecks){
        if(user.skillUsedThisTurn && !user.chain){ messageDisplay.textContent='⚠️ 本回合已使用过技能'; return; }
        if(user.lock && skillId!=='lock'){ messageDisplay.textContent='🚫 技能被封锁，无法使用！'; return; }
        if(user.lockedSkill === skillId){ messageDisplay.textContent='🔒 该技能已被封锁！'; return; }
        const cd = user.cooldowns[skillId] || 0;
        if(cd > 0) { messageDisplay.textContent='⚠️ 技能冷却中'; return; }
    }

    // 远程 Guest 使用技能：发送请求给 Host，不本地执行
    if(G.mode.includes('remote') && !G.isHost && !ignoreChecks){
        const needsNumber = ['verifier','trap','bluff','blackhole'].includes(skillId);
        if(needsNumber){
            G.processing = true;
            setKeypadEnabled(false);
            showNumberPicker('选择数字', G.low, G.high, function(num){
                G.processing = false;
                if(G.conn) G.conn.send({type:'action', action:'skill', playerId:getMyPlayer().id, skillId:skillId, number:num});
                setKeypadEnabled(false);
                clearGuestActionTimeout();
                guestActionTimeout = setTimeout(function(){
                    if(G.processing && G.active){
                        G.processing = false;
                        setKeypadEnabled(isMyTurn());
                        messageDisplay.textContent='⚠️ 网络延迟，请重试';
                    }
                }, 8000);
            }, function(){
                G.processing = false;
                setKeypadEnabled(isMyTurn());
                messageDisplay.textContent = '已取消技能使用';
            });
        } else {
            if(G.conn) G.conn.send({type:'action', action:'skill', playerId:getMyPlayer().id, skillId:skillId});
            G.processing = true;
            setKeypadEnabled(false);
            clearGuestActionTimeout();
            guestActionTimeout = setTimeout(function(){
                if(G.processing && G.active){
                    G.processing = false;
                    setKeypadEnabled(isMyTurn());
                    messageDisplay.textContent='⚠️ 网络延迟，请重试';
                }
            }, 8000);
        }
        return;
    }

    // Host 或本地执行技能逻辑
    if(user.chain){
        user.chain = false;
        user.skillUsedThisTurn = false;
        messageDisplay.textContent = '🔗 连锁触发！可再使用一个技能';
    } else {
        user.skillUsedThisTurn = true;
    }

    let empowered = false;
    if(user.empower){
        user.empower = false;
        empowered = true;
    }

    user.cooldowns[skillId] = skill.cooldown;
    if(skill.cooldown === -1){
        user.skills = user.skills.filter(s => s.id !== skillId);
        user.cooldowns[skillId] = 0;
    }

    const opponent=getOpponentPlayer(user.id);
    let userName;
    if(Privacy.isLocal()) userName=user.name;
    else userName=user.id===getMyPlayer().id?'我':(G.mode.includes('ai')?'AI':'对方');

    function reveal(title, text){
        if(Privacy.isLocal()){
            messageDisplay.textContent=userName+' 使用了 '+skill.name;
            Privacy.showSecret(getPlayer(user.id).name, title, text, null);
        } else if(G.mode.includes('remote')){
            messageDisplay.textContent=userName+' 使用了 '+skill.name;
            if(user.id===getMyPlayer().id) showCheatToast(title+'：'+text);
            else if(G.isHost&&user.id==='p2'&&G.conn) G.conn.send({type:'private', title:title, text:text});
        } else {
            if(user.id==='p1') showCheatToast(title+'：'+text);
            else if(G.mode.includes('ai')) {
                messageDisplay.textContent='🤖 AI 使用了 '+skill.name;
            }
        }
    }

    // 处理AI需要数字输入的技能
    if(G.mode.includes('ai') && user.id === 'p2') {
        const autoNumber = Math.floor(Math.random() * (G.high - G.low + 1)) + G.low;
        if(skillId === 'verifier') {
            if(autoNumber === G.bombNumber) messageDisplay.textContent = '🤖 AI 验证成功！';
            else messageDisplay.textContent = '🤖 AI 验证失败';
            renderSkills(); updateTurnIndicator(); syncIfRemote();
            return;
        }
        if(skillId === 'trap') {
            user.trappedNumber = autoNumber;
            messageDisplay.textContent = '🤖 AI 设置了陷阱数字 '+autoNumber;
            renderSkills(); updateTurnIndicator(); syncIfRemote();
            return;
        }
        if(skillId === 'bluff') {
            user.bluffNumber = autoNumber;
            messageDisplay.textContent = '🤖 AI 虚张声势！声称炸弹在 '+autoNumber;
            renderSkills(); updateTurnIndicator(); syncIfRemote();
            return;
        }
        if(skillId === 'blackhole') {
            if(G.low < G.high - 1) {
                G.low = G.low + 1;
                G.high = G.high - 1;
                if(G.bombNumber < G.low) G.bombNumber = G.low;
                if(G.bombNumber > G.high) G.bombNumber = G.high;
                updateRange();
                messageDisplay.textContent = '🤖 AI 使用了黑洞！范围→'+G.low+'~'+G.high;
            } else {
                messageDisplay.textContent = '⚠️ 范围无法再缩小';
            }
            renderSkills(); updateTurnIndicator(); syncIfRemote();
            return;
        }
    }

    switch(skillId){
        case 'detect': reveal('📡探测','炸弹是'+(G.bombNumber%2===0?'偶数':'奇数')); break;
        case 'peek': { const s=String(G.bombNumber); reveal('🔍透视','炸弹的个位是 '+s[s.length-1]); break; }
        case 'thermometer': {
            const dist = Math.abs(G.bombNumber - Math.floor((G.low+G.high)/2));
            const range = G.high - G.low + 1;
            const level = Math.max(1, Math.min(10, Math.round(10 - (dist / range) * 10)));
            reveal('🌡️温度计','距离等级：'+level+'/10');
            break;
        }
        case 'verifier': {
            G.processing = true;
            showNumberPicker('验证一个数字（只告诉中了还是没中）', G.low, G.high, function(num){
                if(num === G.bombNumber) reveal('🎯验证器','💥 中了！炸弹就是 '+num);
                else reveal('🎯验证器','❌ 没中');
                G.processing = false;
                renderSkills(); updateTurnIndicator(); syncIfRemote();
            }, function(){
                G.processing = false;
                delete user.cooldowns[skillId];
                user.skillUsedThisTurn = false;
                messageDisplay.textContent = '已取消验证';
                renderSkills(); updateTurnIndicator(); syncIfRemote();
            });
            return;
        }
        case 'binary': {
            if(G.low>=G.high){ messageDisplay.textContent='⚠️ 范围无法再缩小'; delete user.cooldowns[skillId]; user.skillUsedThisTurn=false; renderSkills(); return; }
            const mid=Math.floor((G.low+G.high)/2);
            if(G.bombNumber<=mid) G.high=mid; else G.low=mid+1;
            updateRange();
            messageDisplay.textContent='✂️ '+userName+'二分！范围→'+G.low+'~'+G.high;
            break;
        }
        case 'rewind': G.low=G.prevLow; G.high=G.prevHigh; updateRange(); messageDisplay.textContent='⏪ '+userName+'回退！范围→'+G.low+'~'+G.high; break;
        case 'shuffle': G.bombNumber=Math.floor(Math.random()*(G.high-G.low+1))+G.low; messageDisplay.textContent='🔀 '+userName+'洗牌！炸弹位置重置'; break;
        case 'anchor': user.anchored = true; messageDisplay.textContent='📌 '+userName+'锚点！边界已锁定'; break;
        case 'move': {
            if(user.anchored) { messageDisplay.textContent='📌 锚点锁定，移动无效'; delete user.cooldowns[skillId]; user.skillUsedThisTurn=false; renderSkills(); return; }
            const dir=Math.random()<0.5?1:-1;
            const old=G.bombNumber;
            const dist = empowered ? 10 : 5;
            G.bombNumber=Math.max(G.low,Math.min(G.high,G.bombNumber+dir*dist));
            messageDisplay.textContent='🚚 '+userName+'移动！炸弹'+(G.bombNumber>old?'向上':(G.bombNumber<old?'向下':'(已到边界未动)'))+'移动';
            break;
        }
        case 'dormant': user.dormant = true; messageDisplay.textContent='💤 '+userName+'休眠！下次猜中不爆炸，但你的伤害+2'; break;
        case 'web': user.web = true; messageDisplay.textContent='🕸️ '+userName+'蛛网！炸弹周围±3数字都会爆炸'; break;
        case 'magnetic': {
            const chooseMin = Math.random()<0.5;
            const target = chooseMin ? G.low : G.high;
            if(G.bombNumber === target) {
                messageDisplay.textContent='⚠️ 炸弹已在目标边界，技能无效';
                delete user.cooldowns[skillId];
                user.skillUsedThisTurn = false;
                renderSkills();
                return;
            }
            G.bombNumber = target;
            messageDisplay.textContent='🧲 '+userName+'磁性！炸弹移到'+(chooseMin?'最低':'最高')+'数字';
            break;
        }
        case 'double': user.double=true; messageDisplay.textContent='⚡ '+userName+'双倍！下次踩中受2伤'; break;
        case 'pierce': user.pierce=true; messageDisplay.textContent='🗡️ '+userName+'穿透！本回合无视护盾'; break;
        case 'lifesteal': user.lifesteal=true; messageDisplay.textContent='🌙 '+userName+'吸血！踩中你回1血'; break;
        case 'anger': user.anger=true; messageDisplay.textContent='💢 '+userName+'愤怒！每失2血伤+1'; break;
        case 'shield': user.shield=true; messageDisplay.textContent='🛡️ '+userName+'护盾！抵挡下一次伤害'; break;
        case 'reflect': user.reflect=true; messageDisplay.textContent='🪞 '+userName+'反射！反弹伤害'; break;
        case 'heal': {
            const healAmount = empowered ? 2 : 1;
            user.hp=Math.min(user.maxHP,user.hp+healAmount);
            renderPlayers();
            messageDisplay.textContent='💊 '+userName+'治疗 +'+healAmount+'血 ('+user.hp+'/'+user.maxHP+')';
            break;
        }
        case 'rebirth': user.rebirth=true; messageDisplay.textContent='🕊️ '+userName+'重生！死亡以2血复活'; break;
        case 'speed': user.speed=true; messageDisplay.textContent='🏃 '+userName+'加速！本回合可猜两次'; break;
        case 'blind': opponent.blind=true; messageDisplay.textContent='🙈 '+userName+'致盲！对手看不到范围'; break;
        case 'lock': {
            if(opponent.skills.length === 0){ messageDisplay.textContent='⚠️ 对手没有技能可封锁'; delete user.cooldowns[skillId]; user.skillUsedThisTurn=false; renderSkills(); return; }
            const targetSkill = opponent.skills[Math.floor(Math.random()*opponent.skills.length)];
            opponent.lockedSkill = targetSkill.id;
            opponent.lock = true;
            messageDisplay.textContent='🚫 '+userName+'封锁！随机禁掉对手一个技能';
            break;
        }
        case 'pause': opponent.skipNext=true; messageDisplay.textContent='🕐 '+userName+'暂停！对手跳过下次行动'; break;
        case 'slow': opponent.slow=true; messageDisplay.textContent='🐌 '+userName+'缓速！对手猜错不缩范围'; break;
        case 'allin': user.allin=true; messageDisplay.textContent='🔥 '+userName+'孤注一掷！猜中3倍伤，错自伤1'; break;
        case 'coin': {
            const result = Math.random()<0.5?'正面':'反面';
            if(result==='正面'){
                user.speed = true;
                messageDisplay.textContent='🪙 硬币正面！'+userName+'可多猜一次';
            } else {
                opponent.skipNext = true;
                messageDisplay.textContent='🪙 硬币反面！对手少一次行动';
            }
            break;
        }
        case 'bet': user.bet=true; messageDisplay.textContent='🎯 '+userName+'押注！押对手猜错'; break;
        case 'bluff': {
            G.processing = true;
            showNumberPicker('虚张声势：声称炸弹在哪个数字？', G.low, G.high, function(num){
                user.bluffNumber = num;
                G.processing = false;
                messageDisplay.textContent='🃏 '+userName+'虚张声势！声称炸弹在 '+num;
                renderSkills(); updateTurnIndicator(); syncIfRemote();
            }, function(){
                G.processing = false;
                delete user.cooldowns[skillId];
                user.skillUsedThisTurn = false;
                messageDisplay.textContent = '已取消虚张声势';
                renderSkills(); updateTurnIndicator(); syncIfRemote();
            });
            return;
        }
        case 'fog': opponent.fog=true; messageDisplay.textContent='🌫️ '+userName+'迷雾！对手下次反馈相反'; break;
        case 'disguise': {
            let newBomb;
            do {
                newBomb = Math.floor(Math.random()*(G.high-G.low+1))+G.low;
            } while(newBomb === G.bombNumber);
            user.disguise = true;
            user.disguiseNumber = G.bombNumber;
            G.bombNumber = newBomb;
            messageDisplay.textContent='🎭 '+userName+'伪装！炸弹看起来变了';
            break;
        }
        case 'lie': user.lie=true; messageDisplay.textContent='🤥 '+userName+'说谎！下条信息可能为假'; break;
        case 'illusion': {
            opponent.illusion = true;
            const fakeLow = Math.max(G.minVal, G.low + Math.floor(Math.random()*5));
            const fakeHigh = Math.min(G.maxVal, G.high - Math.floor(Math.random()*5));
            opponent.fakeLow = fakeLow;
            opponent.fakeHigh = fakeHigh;
            messageDisplay.textContent='🎪 '+userName+'障眼法！对手看到假范围';
            break;
        }
        case 'copy': {
            if(opponent.skills.length === 0){ messageDisplay.textContent='⚠️ 对手没有技能可复制'; delete user.cooldowns[skillId]; user.skillUsedThisTurn=false; renderSkills(); return; }
            const randomSkill = opponent.skills[Math.floor(Math.random()*opponent.skills.length)];
            messageDisplay.textContent='📋 '+userName+'复制了对手的技能：'+randomSkill.name;
            useSkill(randomSkill.id, user.id, true, copyDepth + 1);
            return;
        }
        case 'trap': {
            G.processing=true;
            showNumberPicker('设置陷阱数字', G.low, G.high, function(num){
                user.trappedNumber = num;
                G.processing = false;
                messageDisplay.textContent='🪤 '+userName+'设置了陷阱数字 '+num;
                renderSkills(); updateTurnIndicator(); syncIfRemote();
            }, function(){
                G.processing = false;
                delete user.cooldowns[skillId];
                user.skillUsedThisTurn = false;
                messageDisplay.textContent = '已取消陷阱';
                renderSkills(); updateTurnIndicator(); syncIfRemote();
            });
            return;
        }
        case 'scout': {
            const oppSkills = opponent.skills.map(s=>s.name).join('、') || '无';
            reveal('📡侦察','对手技能：'+oppSkills);
            break;
        }
        case 'chain': user.chain=true; messageDisplay.textContent='🔗 '+userName+'连锁！用技能后可再用一个'; break;
        case 'empower': user.empower=true; messageDisplay.textContent='🌟 '+userName+'赋能！下一个技能效果翻倍'; break;
        case 'freeze': opponent.frozen=true; messageDisplay.textContent='🧊 '+userName+'冰封！炸弹数字暂时无法猜中'; break;
        case 'heat': user.heat=true; messageDisplay.textContent='🔥 '+userName+'灼热！猜中边缘数字额外受伤'; break;
        case 'bomblet': user.bomblet=true; messageDisplay.textContent='💣 '+userName+'子母弹！下次爆炸额外2伤'; break;
        case 'blackhole': {
            G.processing=true;
            showNumberPicker('黑洞：选择一个数字，范围向其靠拢1', G.low, G.high, function(num){
                if(G.low < G.high - 1){
                    G.low = G.low + 1;
                    G.high = G.high - 1;
                    if(empowered){
                        G.low = G.low + 1;
                        G.high = G.high - 1;
                    }
                    if(G.low > G.high){ const t=G.low; G.low=G.high; G.high=t; }
                    if(G.bombNumber < G.low) G.bombNumber = G.low;
                    if(G.bombNumber > G.high) G.bombNumber = G.high;
                    updateRange();
                    messageDisplay.textContent='🕳️ '+userName+'黑洞！范围→'+G.low+'~'+G.high;
                } else {
                    messageDisplay.textContent='⚠️ 范围无法再缩小';
                }
                G.processing = false;
                renderSkills(); updateTurnIndicator(); syncIfRemote();
            }, function(){
                G.processing = false;
                delete user.cooldowns[skillId];
                user.skillUsedThisTurn = false;
                messageDisplay.textContent = '已取消黑洞';
                renderSkills(); updateTurnIndicator(); syncIfRemote();
            });
            return;
        }
        case 'mutate': {
            const sum = String(G.bombNumber).split('').reduce((a,b)=>a+parseInt(b),0);
            if(sum >= G.low && sum <= G.high && sum !== G.bombNumber){
                G.bombNumber = sum;
                messageDisplay.textContent='🧬 '+userName+'变异！炸弹变为数字和 '+sum;
            } else {
                messageDisplay.textContent='🧬 变异失败！炸弹不变';
            }
            break;
        }
        case 'tide': {
            const expandAmount = empowered ? 10 : 5;
            G.low = Math.max(G.minVal, G.low - expandAmount);
            G.high = Math.min(G.maxVal, G.high + expandAmount);
            G.tideShrinkNext = true;
            updateRange();
            messageDisplay.textContent='🌊 '+userName+'潮汐！范围扩大'+expandAmount+'，下回合缩小';
            break;
        }
        case 'timerewind': {
            G.players.p1.hp = Math.min(G.players.p1.maxHP, G.roundStartHP.p1);
            G.players.p2.hp = Math.min(G.players.p2.maxHP, G.roundStartHP.p2);
            renderPlayers();
            messageDisplay.textContent='🕰️ '+userName+'时间回溯！双方生命回到回合开始';
            break;
        }
        default: break;
    }
    renderSkills();
    updateTurnIndicator();
    syncIfRemote();
}

function reduceCooldowns(playerId){
    const p=getPlayer(playerId);
    Object.keys(p.cooldowns).forEach(k=>{
        if(p.cooldowns[k] > 0) p.cooldowns[k]--;
    });
    renderSkills();
}

// ========== AI 逻辑 ==========
function aiChooseSkill(ai, human, options){
    const range = G.high - G.low + 1;
    const scores = options.map(function(s){
        let sc = Math.random() * 10;
        if(ai.hp <= 2){
            if(['heal','shield','rebirth'].indexOf(s.id)>=0) sc += 100;
        }
        if(s.id==='double'&&human.hp<=2) sc += 50;
        if(range > 30){
            if(['detect','peek','thermometer','binary'].indexOf(s.id)>=0) sc += 40;
        } else if(range < 10){
            if(['double','pierce','lifesteal','anger'].indexOf(s.id)>=0) sc += 50;
        }
        if(['pause','blind','lock'].indexOf(s.id)>=0) sc += 30;
        if(s.id==='heal' && ai.hp < ai.maxHP) sc += 60;
        if(s.id==='bomblet' && human.hp <= 3) sc += 40;
        return {s:s,sc:sc};
    });
    scores.sort(function(a,b){return b.sc-a.sc;});
    return scores[0].s;
}

function aiTurn(){
    if(!G.active||G.processing||G.currentPlayer!=='p2'||!G.mode.includes('ai')) return;
    G.processing=true;
    setKeypadEnabled(false);
    messageDisplay.textContent='🤖 AI思考中...';
    const ai=getPlayer('p2'), human=getPlayer('p1');
    if(G.isSkillMode && ai.skills.length>0 && !ai.lock && !ai.skillUsedThisTurn){
        let chosenSkill = null;
        let bestScore = -Infinity;
        for(const skill of ai.skills){
            const cd = ai.cooldowns[skill.id]||0;
            if(cd > 0) continue;
            const scored = aiChooseSkill(ai, human, [skill]);
            if(scored.sc > bestScore){
                bestScore = scored.sc;
                chosenSkill = scored.s;
            }
        }
        if(chosenSkill && Math.random() < 0.6){
            useSkill(chosenSkill.id, 'p2');
            G.processing = false;
            if(G.active && G.currentPlayer==='p2') setTimeout(aiGuess, 900);
            return;
        }
    }
    G.processing = false;
    setTimeout(aiGuess, 900);
}

function aiGuess(){
    if(!G.active||G.processing||G.currentPlayer!=='p2'||!G.mode.includes('ai')) return;
    const ai=getPlayer('p2');
    let guess;
    const range=G.high-G.low+1;
    if(G.aiLevel===1) guess=Math.floor(Math.random()*range)+G.low;
    else if(G.aiLevel===2){
        const mid=(G.low+G.high)/2;
        const spread=Math.max(1, Math.floor(range*0.25));
        const offset=Math.floor(Math.random()*(spread*2+1))-spread;
        guess=Math.round(mid+offset);
        guess=Math.max(G.low,Math.min(G.high,guess));
    } else {
        if(Math.random()<0.2) guess=Math.floor(Math.random()*range)+G.low;
        else {
            const mid=(G.low+G.high)/2;
            if((G.low+G.high)%2===0) guess=Math.round(mid);
            else guess=Math.floor(mid)+(Math.random()<0.5?0:1);
            if(range>3&&Math.random()<0.3){
                guess+=(Math.random()<0.5?1:-1);
                guess=Math.max(G.low,Math.min(G.high,guess));
            }
        }
    }
    G.playerInput=String(guess);
    updateInputDisplay();
    messageDisplay.textContent='🤖 AI 输入了 '+guess;
    setTimeout(function(){
        if(!G.active) return;
        G.playerInput='';
        G.processing=false;
        processGuess(guess,false,'p2');
    }, 800);
}

// ========== 键盘事件 ==========
keypadButtons.forEach(function(btn){
    btn.addEventListener('click',function(){
        const val=btn.dataset.value;
        const action=btn.dataset.action;
        if(!G.active||G.processing||!isMyTurn()) return;
        if(Privacy.isLocal()&&G.pendingSkillSelect) return;
        if(val!==undefined){
            if(G.playerInput.length>=getMaxInputLength()) return;
            if(G.playerInput==='' && (val==='0' || val==='00' || val==='000')){
                G.playerInput='0';
                updateInputDisplay();
                return;
            }
            if(G.playerInput==='0' && val!=='0'){
                return;
            }
            G.playerInput+=val;
            updateInputDisplay();
        } else if(action==='back'){
            G.playerInput=G.playerInput.slice(0,-1);
            updateInputDisplay();
        } else if(action==='clear'){
            G.playerInput='';
            updateInputDisplay();
        } else if(action==='confirm'){
            if(G.playerInput===''){ messageDisplay.textContent='⚠️ 请先输入数字'; return; }
            const guess=parseInt(G.playerInput);
            if(G.mode.includes('remote')&&!G.isHost){
                if(G.conn){
                    G.conn.send({type:'action',action:'guess',playerId:getMyPlayer().id,guess:guess});
                    G.processing=true;
                    setKeypadEnabled(false);
                    G.playerInput='';
                    updateInputDisplay();
                    clearGuestActionTimeout();
                    guestActionTimeout = setTimeout(function(){
                        if(G.processing&&G.active){
                            G.processing=false;
                            setKeypadEnabled(isMyTurn());
                            messageDisplay.textContent='⚠️ 网络延迟，请重试';
                        }
                    }, 8000);
                }
                return;
            }
            processGuess(guess,false,G.mode.includes('local')?G.currentPlayer:getMyPlayer().id);
        }
    });
});

document.addEventListener('keydown', function(e){
    if(!G.active || G.processing || !isMyTurn()) return;
    if(Privacy.isLocal() && G.pendingSkillSelect) return;
    if(e.key >= '0' && e.key <= '9'){
        if(G.playerInput.length >= getMaxInputLength()) return;
        if(G.playerInput==='' && e.key==='0'){
            G.playerInput='0';
            updateInputDisplay();
            return;
        }
        if(G.playerInput==='0'){
            return;
        }
        G.playerInput += e.key;
        updateInputDisplay();
    } else if(e.key === 'Backspace'){
        G.playerInput = G.playerInput.slice(0, -1);
        updateInputDisplay();
    } else if(e.key === 'Enter'){
        const guess = parseInt(G.playerInput);
        if(isNaN(guess)) return;
        if(G.mode.includes('remote') && !G.isHost){
            if(G.conn){
                G.conn.send({type:'action', action:'guess', playerId:getMyPlayer().id, guess:guess});
                G.processing=true;
                setKeypadEnabled(false);
                G.playerInput='';
                updateInputDisplay();
                clearGuestActionTimeout();
                guestActionTimeout = setTimeout(function(){
                    if(G.processing&&G.active){
                        G.processing=false;
                        setKeypadEnabled(isMyTurn());
                        messageDisplay.textContent='⚠️ 网络延迟，请重试';
                    }
                }, 8000);
            }
            return;
        }
        processGuess(guess, false, G.mode.includes('local') ? G.currentPlayer : getMyPlayer().id);
    }
});

// ========== 渲染函数 ==========
function renderPlayers(){
    const me=getMyPlayer(), opp=getMyOpponent();
    meName.textContent=me.name; meAvatar.textContent=me.avatar;
    renderLives(meLivesEl, me.hp, me.maxHP, me.id==='p1'?'blue':'red');
    opponentName.textContent=opp.name; opponentAvatar.textContent=opp.avatar;
    renderLives(opponentLivesEl, opp.hp, opp.maxHP, opp.id==='p1'?'blue':'red');
    const cur=getCurrentPlayer();
    if(cur.id===me.id){
        meHighlight.classList.add('active'); opponentHighlight.classList.remove('active');
    } else {
        meHighlight.classList.remove('active'); opponentHighlight.classList.add('active');
    }
}
function renderLives(container, hp, maxHP, color){
    container.innerHTML='';
    for(let i=0;i<maxHP;i++){
        const d=document.createElement('span');
        d.className='dot '+(i<hp?'filled-'+color:'lost');
        container.appendChild(d);
    }
}
function updateRange(){
    const cur=getCurrentPlayer();
    let showLow = G.low, showHigh = G.high;
    if(cur.id !== getMyPlayer().id && cur.illusion){
        showLow = cur.fakeLow || G.low;
        showHigh = cur.fakeHigh || G.high;
        rangeDisplay.textContent='范围：'+showLow+' - '+showHigh;
    } else {
        rangeDisplay.textContent='范围：'+G.low+' - '+G.high;
    }
    if(cur.blind){
        rangeDisplay.textContent='🙈 范围被遮蔽...';
    }
}
function updateInputDisplay(){
    if(G.playerInput===''){ inputDisplay.textContent='等待输入'; inputDisplay.classList.add('empty'); }
    else { inputDisplay.textContent=G.playerInput; inputDisplay.classList.remove('empty'); }
}
function updateTurnIndicator(){
    turnIndicator.classList.remove('turn-me','turn-opponent');
    const cur=getCurrentPlayer(), me=getMyPlayer();
    if(Privacy.isLocal()){
        turnIndicator.textContent=(cur.id==='p1'?'🔵 ':'🔴 ')+cur.name+' 的回合';
        turnIndicator.classList.add(cur.id==='p1'?'turn-me':'turn-opponent');
    } else if(cur.id===me.id){
        turnIndicator.textContent='👇 我的回合';
        turnIndicator.classList.add('turn-me');
    } else {
        turnIndicator.textContent=G.mode.includes('ai')?'🤖 AI思考中...':'👆 对方回合...';
        turnIndicator.classList.add('turn-opponent');
    }
    let shouldEnable;
    if(Privacy.isLocal()) shouldEnable = G.active && !G.processing && Privacy._state !== 'confirm';
    else shouldEnable = G.active && !G.processing && isMyTurn();
    setKeypadEnabled(shouldEnable);
    renderSkills();
}
function setKeypadEnabled(enabled){
    keypadButtons.forEach(btn=>{
        btn.disabled = !enabled;
        if(!enabled){
            btn.style.opacity = '0.25';
            btn.style.pointerEvents = 'none';
        } else {
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'auto';
        }
    });
}
function showExplosion(target){
    const area=target==='me'?meHighlight:opponentHighlight;
    area.classList.add('shake');
    setTimeout(()=>area.classList.remove('shake'),500);
    const ex=document.createElement('div');
    ex.className='explosion'; ex.textContent='💥';
    ex.style.left='50%'; ex.style.top='50%'; ex.style.transform='translate(-50%,-50%)';
    area.appendChild(ex);
    setTimeout(()=>ex.remove(),700);
}
function renderSkills(){
    skillsBar.innerHTML='';
    if(!G.isSkillMode || battleArea.style.display==='none'){
        skillsBar.style.display='none';
        renderOpponentSkills();
        return;
    }
    skillsBar.style.display='flex';
    const owner=Privacy.isLocal()?getCurrentPlayer():getMyPlayer();
    if(!owner||!owner.skills) { renderOpponentSkills(); return; }
    const isLocked=owner.lock;
    const canAct=G.active && !G.processing && owner.id===G.currentPlayer && !isLocked && !owner.skillUsedThisTurn;
    owner.skills.forEach(skill=>{
        const wrap=document.createElement('div');
        wrap.className='skill-btn-wrap';
        const btn=document.createElement('button');
        btn.className='skill-btn';
        const cd=owner.cooldowns[skill.id]||0;
        const isLockedSkill = owner.lockedSkill === skill.id;
        if(cd>0){ btn.textContent=skill.name+' ('+cd+')'; btn.disabled=true; }
        else if(isLockedSkill){ btn.textContent='🔒'+skill.name; btn.disabled=true; }
        else if(isLocked){ btn.textContent='🚫'+skill.name; btn.disabled=true; }
        else if(owner.skillUsedThisTurn){ btn.textContent=skill.name+' (已用)'; btn.disabled=true; }
        else {
            btn.textContent=skill.name;
            btn.disabled=!canAct;
            if(canAct) btn.classList.add('ready');
        }
        btn.addEventListener('click',function(){ useSkill(skill.id); });
        wrap.appendChild(btn);
        const helpBtn=document.createElement('button');
        helpBtn.className='skill-help-btn';
        helpBtn.textContent='?';
        helpBtn.addEventListener('click',function(e){
            e.stopPropagation();
            showCheatToast(skill.name+'：'+skill.desc);
        });
        wrap.appendChild(helpBtn);
        skillsBar.appendChild(wrap);
    });
    renderOpponentSkills();
}
function renderOpponentSkills(){
    opponentSkillsBar.innerHTML='';
    if(!G.isSkillMode || battleArea.style.display==='none'){
        opponentSkillsBar.style.display='none';
        return;
    }
    const opp=getMyOpponent();
    if(!opp||!opp.skills||opp.skills.length===0){
        opponentSkillsBar.style.display='none';
        return;
    }
    opponentSkillsBar.style.display='flex';
    opp.skills.forEach(skill=>{
        const tag=document.createElement('span');
        tag.className='opp-skill-tag';
        const cd=opp.cooldowns[skill.id]||0;
        tag.textContent=opp.name+'：'+skill.name+(cd>0?' ('+cd+')':'');
        const helpBtn=document.createElement('button');
        helpBtn.className='skill-help-btn';
        helpBtn.textContent='?';
        helpBtn.addEventListener('click',function(e){
            e.stopPropagation();
            showCheatToast(skill.name+'：'+skill.desc);
        });
        tag.appendChild(helpBtn);
        opponentSkillsBar.appendChild(tag);
    });
}

// ========== 界面切换 ==========
function hideAll(){
    [mainMenu,normalSubmenu,skillSubmenu,setupOverlay,remoteLobby,remoteWaiting,remoteSetupOverlay].forEach(el=>el.classList.add('hidden'));
    battleArea.style.display='none';
    skillsBar.style.display='none';
    opponentSkillsBar.style.display='none';
    surrenderBtn.style.display='none';
    gameOverBtn.style.display='none';
    rematchBtn.style.display='none';
    chatToggleBtn.style.display='none';
    chatOverlay.classList.add('hidden');
    skillSelectOverlay.classList.remove('active');
    nameEditOverlay.classList.remove('active');
    numberSelectOverlay.classList.add('hidden');
    numberSelectOverlay.classList.remove('active');
    Privacy.hide();
    clearAllTimers();
    G.pendingSkillSelect=null; G.pendingSkillOptions=null;
    G.pendingSkillCount=null; G.pendingRoundOptions=null;
    skillSelectPhase=null; G.hostSkillComplete=null;
    G.skillSelectShown = false;
}
function showMainMenu(){ hideAll(); mainMenu.classList.remove('hidden'); if(!G.conn) roomInfo.textContent='未连接'; }
function showNormalSubmenu(){ hideAll(); normalSubmenu.classList.remove('hidden'); }
function showSkillSubmenu(){ hideAll(); skillSubmenu.classList.remove('hidden'); }
function showSetup(mode){
    hideAll();
    G.mode=mode;
    G.isSkillMode=mode.includes('skill');
    setupOverlay.classList.remove('hidden');
    aiLevelRow.style.display=mode.includes('ai')?'flex':'none';
    $('skill-count-row').style.display = G.isSkillMode ? 'flex' : 'none';
}
function showRemoteLobby(){
    hideAll();
    G.remoteReady.host = false;
    G.remoteReady.guest = false;
    remoteLobby.classList.remove('hidden');
    setConnStatus('');
}
function showRemoteSetup(){
    hideAll();
    remoteSetupOverlay.classList.remove('hidden');
    $('remote-skill-count-row').style.display = G.isSkillMode ? 'flex' : 'none';
    if(G.isHost){
        remoteSettingsContainer.style.display = 'block';
        remoteReadyBtn.style.display = 'none';
        remoteStartBtn.style.display = 'block';
        if (G.remoteReady.guest) {
            remoteStartBtn.disabled = false;
            remoteReadyStatus.textContent = '✅ 对方已准备，可以开始游戏';
        } else {
            remoteStartBtn.disabled = true;
            remoteReadyStatus.textContent = '等待对方准备...';
        }
    } else {
        remoteSettingsContainer.style.display = 'none';
        remoteReadyBtn.style.display = 'block';
        remoteReadyBtn.disabled = false;
        remoteStartBtn.style.display = 'none';
        remoteReadyStatus.textContent = '请输入名称并点击准备';
    }
}
function showRemoteWaiting(){ hideAll(); remoteWaiting.classList.remove('hidden'); }
function showBattleArea(){
    hideAll();
    battleArea.style.display='flex';
    surrenderBtn.style.display='block';
    if(G.isSkillMode){ skillsBar.style.display='flex'; renderSkills(); }
    if(G.mode.includes('remote') && G.conn && G.conn.open) chatToggleBtn.style.display='inline-block';
}

// ========== 事件绑定 ==========
$('normal-mode-btn').addEventListener('click',showNormalSubmenu);
$('skill-mode-btn').addEventListener('click',showSkillSubmenu);
$('normal-back-btn').addEventListener('click',showMainMenu);
$('skill-back-btn').addEventListener('click',showMainMenu);
$('normal-local-btn').addEventListener('click',function(){showSetup('local-normal')});
$('normal-ai-btn').addEventListener('click',function(){showSetup('ai-normal')});
$('skill-local-btn').addEventListener('click',function(){showSetup('local-skill')});
$('skill-ai-btn').addEventListener('click',function(){showSetup('ai-skill')});
$('normal-remote-btn').addEventListener('click',function(){ G.isSkillMode=false; showRemoteLobby(); });
$('skill-remote-btn').addEventListener('click',function(){ G.isSkillMode=true; showRemoteLobby(); });
$('back-menu-btn1').addEventListener('click',showMainMenu);
$('back-menu-btn2').addEventListener('click',showMainMenu);
aiLevelRow.querySelectorAll('.ai-level-btn').forEach(function(b){
    b.addEventListener('click',function(){
        aiLevelRow.querySelectorAll('.ai-level-btn').forEach(function(x){x.classList.remove('active')});
        b.classList.add('active');
        G.aiLevel=parseInt(b.dataset.level);
    });
});
$('start-game-btn').addEventListener('click',function(){
    readSetupInputs(false);
    if(G.isSkillMode){
        G.skillCount = parseInt(skillCountInput.value) || 1;
        G.skillCount = Math.max(1, Math.min(3, G.skillCount));
    }
    initGame();
});
surrenderBtn.addEventListener('click',function(){
    if(!G.active) return;
    if(G.mode.includes('remote')&&!G.isHost){
        if(G.conn) G.conn.send({type:'action',action:'surrender',playerId:'p2'});
        messageDisplay.textContent='🏳️ 你认输了';
        G.active=false;
        endGame();
        return;
    }
    const me=Privacy.isLocal()?getCurrentPlayer():getMyPlayer();
    me.hp=0;
    renderPlayers();
    messageDisplay.textContent='🏳️ '+me.name+' 认输了！';
    endGame();
    syncIfRemote();
});
gameOverBtn.addEventListener('click',function(){
    if(G.mode.includes('remote')){ cleanupRemote(); }
    showMainMenu();
});
rematchBtn.addEventListener('click',function(){
    rematchBtn.disabled=true;
    if(G.mode.includes('remote')){
        if(G.isHost&&G.conn&&G.conn.open){
            G.conn.send({type:'rematch'});
            initGame();
        }
    } else {
        initGame();
    }
    setTimeout(function(){ rematchBtn.disabled=false; }, 1000);
});

$('create-room-btn').addEventListener('click',function(){
    G.roomCode=generateRoomCode();
    G.isHost=true;
    G.myRole='host';
    G.remoteReady.host=false;
    G.remoteReady.guest=false;
    remoteStartBtn.disabled=true;
    remoteReadyStatus.textContent='';
    lobbyMessage.textContent='';
    setConnStatus('正在创建房间...');
    createPeer('bomb-' + G.roomCode, function(peerId) {
        showRemoteWaiting();
        waitingRoomCode.textContent=G.roomCode;
        waitingText.textContent='等待对手加入...';
        copyLinkBtn.style.display='block';
        lobbyMessage.textContent='';
        setConnStatus('房间已创建，可分享链接邀请对手');
        G.peer.on('connection',function(conn){
            if(G.conn){ try{conn.close();}catch(e){} return; }
            setupConnection(conn);
        });
        G.peer.on('error',function(err){
            if(err.type==='unavailable-id'){
                waitingText.textContent='房间码冲突，正在重新生成...';
                setTimeout(function(){ $('create-room-btn').click(); }, 500);
            }
        });
    }, function(errMsg) {
        setConnStatus('创建房间失败: ' + errMsg);
        lobbyMessage.textContent = '❌ 无法创建房间，请检查网络连接';
    });
});

$('join-room-btn').addEventListener('click',function(){
    const code=joinRoomInput.value.trim().toUpperCase();
    if(code.length!==6){ lobbyMessage.textContent='请输入6位房间码'; return; }
    G.roomCode=code;
    G.isHost=false;
    G.myRole='guest';
    G.remoteReady.host=false;
    G.remoteReady.guest=false;
    lobbyMessage.textContent='';
    attemptJoinRoom(code, 0);
});

copyLinkBtn.addEventListener('click',function(){
    const baseUrl = window.location.origin + window.location.pathname;
    const url=baseUrl+'?room='+G.roomCode;
    if(navigator.clipboard){
        navigator.clipboard.writeText(url).then(function(){showCheatToast('📋 链接已复制')}).catch(function(){showCheatToast(url)});
    } else showCheatToast('复制失败，手动复制: '+url);
});

$('cancel-waiting-btn').addEventListener('click',function(){
    cleanupRemote();
    showRemoteLobby();
});

remoteReadyBtn.addEventListener('click',function(){
    const name = remoteNameInput.value.trim();
    if(!name){ showCheatToast('请输入名称'); return; }
    getMyPlayer().name = name;
    if(!G.isHost){
        G.remoteReady.guest = true;
        remoteReadyStatus.textContent = '✅ 已准备，等待房主开始...';
        remoteReadyBtn.disabled = true;
        if(G.conn) G.conn.send({type:'action', action:'ready', name:name});
    }
});

remoteStartBtn.addEventListener('click',function(){
    if(!G.remoteReady.guest){ showCheatToast('对方尚未准备'); return; }
    readSetupInputs(true);
    if(G.isSkillMode){
        G.skillCount = parseInt(remoteSkillCountInput.value) || 1;
        G.skillCount = Math.max(1, Math.min(3, G.skillCount));
    }
    G.mode=G.isSkillMode?'remote-skill':'remote-normal';
    if(G.conn&&G.conn.open){
        G.conn.send({type:'start',minVal:G.minVal,maxVal:G.maxVal,isSkillMode:G.isSkillMode,hp:getPlayer('p1').maxHP,skillCount:G.skillCount});
    }
    initGame();
});

// ========== 全屏 ==========
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
        });
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
}
function updateFullscreenIcon() {
    fullscreenBtn.textContent = document.fullscreenElement ? '🔳' : '⛶';
}
fullscreenBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', updateFullscreenIcon);
document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

// ========== 自动加入房间 ==========
function checkUrlRoom() {
    try {
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room');
        if (room && room.length === 6) {
            const tryJoin = function() {
                if (typeof Peer === 'undefined') { setTimeout(tryJoin, 500); return; }
                if (joinRoomInput) {
                    joinRoomInput.value = room.toUpperCase();
                    showRemoteLobby();
                    lobbyMessage.textContent = '已填入房间码，正在自动加入...';
                    setTimeout(function() { $('join-room-btn').click(); }, 300);
                }
            };
            tryJoin();
        }
    } catch(e) {}
}

// ========== 初始化 ==========
showMainMenu();
checkUrlRoom();

})();
</script>
