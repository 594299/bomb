<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>💣 数字炸弹 · 完整版</title>
<style>
/* ==================== 全局变量与基础样式 ==================== */
:root {
  --neon:#00f0ff;    /* 主色调：霓虹青 */
  --blue:#4da6ff;    /* 蓝色：我方 */
  --red:#ff6b6b;     /* 红色：对方 */
}
/* 清除默认边距和内边距，禁止用户选择文本 */
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
/* 固定页面，防止滚动 */
html, body { height:100%; width:100%; overflow:hidden; position:fixed; inset:0; background:#05000a; color:#fff; font-family:system-ui,sans-serif; }
/* 适配刘海屏安全区域 */
body { padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
/* 游戏容器：最大宽度500px，居中 */
#game-container { width:100%; max-width:500px; height:100%; background:linear-gradient(180deg,#0d0d1a,#1a0a20); display:flex; flex-direction:column; margin:0 auto; position:relative; }
/* 顶部标题栏 */
#header { padding:10px; background:rgba(0,0,0,0.5); display:flex; justify-content:space-between; align-items:center; z-index:10; }
#header h1 { font-size:1.1rem; background:linear-gradient(135deg,#ff8800,#ff00e6,#00f0ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
/* 房间信息显示 */
#room-info { font-size:0.7rem; color:#ccc; background:rgba(255,255,255,0.1); padding:4px 10px; border-radius:12px; }
#header-right { display:flex; align-items:center; gap:6px; }
/* 覆盖层：用于菜单、设置等弹窗 */
.overlay { position:absolute; inset:0; background:rgba(0,0,0,0.95); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:1000; padding:20px; }
.overlay.hidden { display:none; }
.overlay-title { font-size:1.6rem; font-weight:900; margin-bottom:20px; text-align:center; }
/* 按钮样式 */
.btn { padding:14px 40px; border:2px solid var(--neon); border-radius:50px; background:rgba(0,240,255,0.1); color:var(--neon); font-size:1rem; font-weight:700; cursor:pointer; margin-top:12px; min-width:220px; outline:none; }
.btn:active { transform:scale(0.95); }
.btn.secondary { background:rgba(255,136,0,0.1); border-color:#ff8800; color:#ff8800; }
.btn.small { padding:8px 20px; min-width:auto; font-size:0.8rem; }
/* 房间码输入框 */
.room-input { width:200px; padding:12px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); border-radius:10px; color:#fff; font-size:1.5rem; text-align:center; letter-spacing:8px; outline:none; margin-top:15px; text-transform:uppercase; }
.room-display { font-size:2rem; font-weight:900; letter-spacing:10px; color:var(--neon); margin:20px 0; }
.waiting-text { font-size:0.9rem; color:#ccc; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }
/* 设置行 */
.setting-row { display:flex; align-items:center; gap:8px; margin:6px 0; flex-wrap:wrap; justify-content:center; }
.setting-row label { font-size:0.8rem; color:#ccc; }
.setting-row input { width:70px; padding:8px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); border-radius:6px; color:#fff; font-size:1rem; text-align:center; outline:none; }
/* AI难度按钮 */
.ai-level-btn { padding:8px 16px; border-radius:20px; font-size:0.75rem; font-weight:700; cursor:pointer; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.2); color:#ccc; margin:0 3px; }
.ai-level-btn.active { background:rgba(0,240,255,0.2); border-color:var(--neon); color:var(--neon); }
/* 战斗区域 */
#battle-area { flex:1; display:none; flex-direction:column; justify-content:space-between; padding:4px 8px; }
.player-area { display:flex; flex-direction:column; align-items:center; gap:1px; }
.player-area .avatar { font-size:2rem; }
.player-area .name-tag { font-size:0.6rem; color:#ccc; background:rgba(0,0,0,0.5); padding:1px 8px; border-radius:8px; }
/* 生命值圆点 */
.life-dots { display:flex; gap:3px; }
.life-dots .dot { width:9px; height:9px; border-radius:50%; border:2px solid #555; display:inline-block; }
.life-dots .dot.filled-blue { background:var(--blue); border-color:var(--blue); }
.life-dots .dot.filled-red { background:var(--red); border-color:var(--red); }
.life-dots .dot.lost { background:transparent; border-color:#333; }
/* 高亮边框 */
.highlight { border:2px solid transparent; border-radius:12px; padding:3px 12px; transition:all 0.3s; position:relative; }
.highlight.active { border-color:var(--neon); box-shadow:0 0 12px rgba(0,240,255,0.3); }
/* 信息区域 */
#info-area { display:flex; flex-direction:column; align-items:center; gap:3px; padding:2px 0; }
#range-display { font-size:0.8rem; font-weight:700; color:var(--neon); background:rgba(0,240,255,0.08); padding:3px 14px; border-radius:15px; }
#turn-indicator { font-size:0.75rem; font-weight:700; background:rgba(255,255,255,0.06); padding:3px 14px; border-radius:12px; }
#turn-indicator.turn-me { color:var(--blue); border:1px solid var(--blue); }
#turn-indicator.turn-opponent { color:var(--red); border:1px solid var(--red); }
#message-display { font-size:0.7rem; color:#bbb; min-height:1rem; text-align:center; max-width:95%; padding:0 5px; }
/* 对方技能栏 */
#opponent-skills-bar { display:none; gap:4px; justify-content:center; flex-wrap:wrap; padding:2px 0; }
#opponent-skills-bar .opp-skill-tag { padding:3px 8px; border:1px solid rgba(255,100,100,0.35); border-radius:8px; background:rgba(255,100,100,0.07); color:#ff9999; font-size:0.6rem; font-weight:700; }
/* 输入区域 */
#input-keypad-container { display:flex; flex-direction:column; align-items:center; gap:3px; padding:2px 0; }
#input-display { font-size:1.2rem; font-weight:900; min-height:1.8rem; letter-spacing:2px; background:rgba(0,0,0,0.4); border:2px solid rgba(0,240,255,0.35); border-radius:8px; padding:2px 16px; min-width:100px; text-align:center; }
#input-display.empty { border-color:rgba(255,255,255,0.15); color:#555; }
/* 数字键盘 */
#keypad { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; width:100%; max-width:220px; }
.key-btn { aspect-ratio:1.1; border:1.5px solid rgba(255,255,255,0.15); border-radius:8px; background:rgba(255,255,255,0.05); color:#fff; font-size:0.9rem; font-weight:700; cursor:pointer; min-width:44px; min-height:44px; }
.key-btn:active { transform:scale(0.88); background:rgba(255,255,255,0.18); }
.key-btn.func { font-size:0.7rem; background:rgba(255,136,0,0.1); color:#ff8800; }
.key-btn.confirm { font-size:0.75rem; background:rgba(0,255,136,0.12); color:#00ff88; }
.key-btn:disabled { opacity:0.25; pointer-events:none; }
/* 爆炸动画 */
.explosion { position:absolute; font-size:2.5rem; animation:explode 0.7s forwards; pointer-events:none; z-index:100; }
@keyframes explode { 0%{transform:scale(0.3);opacity:1;} 50%{transform:scale(1.4);} 100%{transform:scale(2);opacity:0;} }
.shake { animation:shakeAnim 0.5s both; }
@keyframes shakeAnim { 0%,100%{transform:translate(0,0);} 20%{transform:translate(-8px,6px);} 40%{transform:translate(7px,-5px);} 60%{transform:translate(-5px,-4px);} 80%{transform:translate(5px,4px);} }
/* 作弊按钮已删除 */
/* 提示弹窗 */
#cheat-toast { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.85); padding:10px 20px; border-radius:10px; font-size:0.9rem; font-weight:700; z-index:3000; opacity:0; transition:opacity 0.3s; pointer-events:none; }
#cheat-toast.show { opacity:1; }
/* 认输按钮 */
#surrender-btn { padding:6px 12px; border:1px solid rgba(255,80,80,0.4); border-radius:15px; background:rgba(255,50,50,0.08); color:#ff6666; font-size:0.65rem; font-weight:700; cursor:pointer; margin-top:4px; display:none; }
/* 技能栏 */
#skills-bar { display:none; gap:4px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
.skill-btn { padding:4px 10px; border:1.5px solid rgba(255,255,255,0.3); border-radius:10px; background:rgba(255,255,255,0.05); color:#999; font-size:0.65rem; font-weight:700; cursor:pointer; min-height:32px; }
.skill-btn.ready { border-color:var(--neon); color:var(--neon); background:rgba(0,240,255,0.08); box-shadow:0 0 8px rgba(0,240,255,0.2); }
.skill-btn:disabled { opacity:0.3; pointer-events:none; }
/* 技能选择覆盖层 */
#skill-select-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.96); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:2000; padding:20px; }
#skill-select-overlay.active { display:flex; }
#skill-select-overlay.rotated { transform:rotate(180deg); }
.skill-select-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:340px; }
.skill-select-card { padding:12px 6px; border:2px solid rgba(255,255,255,0.2); border-radius:12px; cursor:pointer; text-align:center; background:rgba(255,255,255,0.03); }
.skill-select-card:active { transform:scale(0.95); }
.skill-select-card .skill-icon { font-size:1.8rem; }
.skill-select-card .skill-name { font-size:0.75rem; font-weight:700; margin-top:4px; }
.skill-select-card .skill-desc { font-size:0.55rem; color:#aaa; margin-top:3px; line-height:1.4; }
/* 游戏结束按钮 */
#game-over-btn, #rematch-btn { display:none; padding:8px 20px; border-radius:20px; font-size:0.8rem; font-weight:700; cursor:pointer; margin-top:6px; }
#game-over-btn { border:2px solid var(--neon); background:rgba(0,240,255,0.1); color:var(--neon); }
#rematch-btn { border:2px solid #ff8800; background:rgba(255,136,0,0.1); color:#ff8800; }
/* 技能选择倒计时 */
#skill-timer { font-size:2rem; font-weight:900; color:var(--neon); margin:10px 0; }
/* 对手区域旋转（本地模式） */
#opponent-area.rotated { transform:rotate(180deg); }
/* 隐私遮罩 */
#privacy-screen { position:absolute; inset:0; background:rgba(0,0,0,0.98); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:2500; padding:20px; cursor:pointer; text-align:center; }
#privacy-screen.active { display:flex; }
#privacy-screen.revealed .privacy-handoff { display:none; }
.privacy-handoff .p-title { font-size:1.5rem; font-weight:900; color:var(--neon); }
.privacy-handoff .p-sub { font-size:0.85rem; color:#999; margin-top:12px; animation:pulse 1.5s infinite; }
#privacy-content { display:none; }
#privacy-screen.revealed #privacy-content { display:block; }
.privacy-hide-btn { padding:10px 24px; border:1px solid rgba(255,255,255,0.3); border-radius:20px; background:rgba(255,255,255,0.05); color:#aaa; font-size:0.8rem; cursor:pointer; margin-top:16px; }
.privacy-result { font-size:1.2rem; color:var(--neon); font-weight:700; margin:10px 0; line-height:1.5; }
.privacy-label { font-size:0.8rem; color:#888; }
#conn-status { font-size:0.65rem; color:#888; margin-top:8px; }
/* 聊天按钮和角标 */
#chat-toggle-btn { display:none; background:none; border:1.5px solid rgba(255,255,255,0.2); border-radius:8px; padding:4px 8px; font-size:0.9rem; cursor:pointer; color:#ccc; position:relative; }
.chat-badge { position:absolute; top:-4px; right:-4px; background:#ff4444; color:#fff; font-size:0.6rem; font-weight:900; border-radius:50%; width:16px; height:16px; display:none; align-items:center; justify-content:center; }
.chat-badge.show { display:flex; }
/* 聊天窗口 */
#chat-overlay { z-index:3100; }
.chat-container { width:90%; max-width:400px; height:70%; background:#111; border-radius:15px; border:1px solid rgba(255,255,255,0.2); display:flex; flex-direction:column; overflow:hidden; }
.chat-header { display:flex; justify-content:space-between; align-items:center; padding:10px 15px; background:rgba(255,255,255,0.05); border-bottom:1px solid rgba(255,255,255,0.1); font-weight:700; }
.chat-close-btn { background:none; border:none; color:#aaa; font-size:1.2rem; cursor:pointer; }
.chat-messages { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:6px; }
.chat-msg { max-width:80%; padding:6px 10px; border-radius:10px; font-size:0.8rem; word-break:break-word; }
.chat-msg.mine { align-self:flex-end; background:rgba(0,240,255,0.15); border:1px solid rgba(0,240,255,0.3); color:#e0faff; }
.chat-msg.opponent { align-self:flex-start; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15); color:#ddd; }
.chat-msg.system { align-self:center; background:none; border:none; color:#888; font-size:0.7rem; }
.chat-input-row { display:flex; padding:8px; border-top:1px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.3); }
#chat-input { flex:1; padding:8px 12px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:15px; color:#fff; font-size:0.85rem; outline:none; }
#chat-send-btn { margin-left:6px; padding:8px 15px; border:none; border-radius:15px; background:var(--neon); color:#000; font-weight:700; cursor:pointer; }
/* 聊天消息通知弹窗 */
#chat-notification { position:absolute; top:60px; right:10px; background:rgba(20,20,35,0.95); border:1px solid rgba(0,240,255,0.4); border-radius:12px; padding:12px 15px; z-index:3200; max-width:250px; display:none; box-shadow:0 4px 20px rgba(0,0,0,0.5); }
#chat-notification.show { display:block; animation:slideIn 0.3s ease-out; }
@keyframes slideIn { from { transform:translateX(20px); opacity:0; } to { transform:translateX(0); opacity:1; } }
.chat-notif-header { display:flex; justify-content:space-between; align-items:center; font-size:0.7rem; color:var(--neon); font-weight:700; }
.chat-notif-close { background:none; border:none; color:#aaa; cursor:pointer; font-size:0.8rem; }
.chat-notif-body { font-size:0.8rem; color:#ddd; margin-top:6px; word-break:break-word; }
</style>
</head>
<body>
<div id="game-container">
  <div id="header">
    <h1>💣 数字炸弹</h1>
    <div id="header-right">
      <!-- 聊天按钮（仅远程模式显示） -->
      <button id="chat-toggle-btn">💬<span id="chat-badge" class="chat-badge">0</span></button>
      <div id="room-info">未连接</div>
    </div>
  </div>
  <!-- 主菜单 -->
  <div id="main-menu" class="overlay">
    <div class="overlay-title">选择模式</div>
    <button class="btn" id="normal-mode-btn">🎮 普通模式</button>
    <button class="btn secondary" id="skill-mode-btn">⚡ 技能模式</button>
  </div>
  <!-- 普通模式子菜单 -->
  <div id="normal-submenu" class="overlay hidden">
    <div class="overlay-title">普通模式</div>
    <button class="btn" id="normal-local-btn">📱 本地双人</button>
    <button class="btn" id="normal-ai-btn">🤖 AI对战</button>
    <button class="btn" id="normal-remote-btn">🌐 远程对战</button>
    <button class="btn secondary" id="normal-back-btn">返回</button>
  </div>
  <!-- 技能模式子菜单 -->
  <div id="skill-submenu" class="overlay hidden">
    <div class="overlay-title">技能模式</div>
    <button class="btn" id="skill-local-btn">📱 本地双人</button>
    <button class="btn" id="skill-ai-btn">🤖 AI对战</button>
    <button class="btn" id="skill-remote-btn">🌐 远程对战</button>
    <button class="btn secondary" id="skill-back-btn">返回</button>
  </div>
  <!-- 游戏设置界面 -->
  <div id="setup-overlay" class="overlay hidden">
    <div class="overlay-title">⚙️ 游戏设置</div>
    <div class="setting-row">
      <label>最小值：</label><input type="number" id="min-input" value="1" min="1">
      <label>最大值：</label><input type="number" id="max-input" value="100" min="2">
    </div>
    <div class="setting-row">
      <label>生命值（1-15）：</label><input type="number" id="hp-input" value="5" min="1" max="15">
    </div>
    <div class="setting-row" id="ai-level-row" style="display:none;">
      <label>AI难度：</label>
      <button class="ai-level-btn active" data-level="1">简单</button>
      <button class="ai-level-btn" data-level="2">中等</button>
      <button class="ai-level-btn" data-level="3">困难</button>
    </div>
    <button class="btn" id="start-game-btn">开始游戏</button>
    <button class="btn secondary" id="back-menu-btn1">返回</button>
  </div>
  <!-- 远程大厅 -->
  <div id="remote-lobby" class="overlay hidden">
    <div class="overlay-title">远程对战</div>
    <button class="btn" id="create-room-btn">创建房间</button>
    <div style="margin:15px 0;color:#666;">— 或 —</div>
    <input type="text" class="room-input" id="join-room-input" placeholder="房间码" maxlength="6">
    <button class="btn" id="join-room-btn">加入房间</button>
    <div id="lobby-message" style="margin-top:15px;color:#ff6666;font-size:0.8rem;"></div>
    <div id="conn-status"></div>
    <button class="btn secondary" id="back-menu-btn2">返回</button>
  </div>
  <!-- 远程等待界面 -->
  <div id="remote-waiting" class="overlay hidden">
    <div class="overlay-title">房间码</div>
    <div class="room-display" id="waiting-room-code">------</div>
    <div class="waiting-text" id="waiting-text">等待对手加入...</div>
    <button class="btn" id="cancel-waiting-btn">取消</button>
    <button class="btn small" id="copy-link-btn" style="display:none;">📋 复制邀请链接</button>
  </div>
  <!-- 远程设置界面 -->
  <div id="remote-setup-overlay" class="overlay hidden">
    <div class="overlay-title">⚙️ 远程游戏设置</div>
    <div class="setting-row">
      <label>最小值：</label><input type="number" id="remote-min-input" value="1" min="1">
      <label>最大值：</label><input type="number" id="remote-max-input" value="100" min="2">
    </div>
    <div class="setting-row">
      <label>生命值（1-15）：</label><input type="number" id="remote-hp-input" value="5" min="1" max="15">
    </div>
    <button class="btn" id="remote-start-btn">开始游戏</button>
  </div>
  <!-- 战斗区域 -->
  <div id="battle-area">
    <!-- 对手区域 -->
    <div class="player-area" id="opponent-area">
      <div class="highlight" id="opponent-highlight">
        <div class="avatar" id="opponent-avatar">🙂</div>
        <div class="life-dots" id="opponent-lives"></div>
        <div class="name-tag" id="opponent-name">对手</div>
      </div>
    </div>
    <!-- 信息区域 -->
    <div id="info-area">
      <div id="range-display">范围：1 - 100</div>
      <div id="turn-indicator">等待...</div>
      <div id="message-display">游戏开始</div>
    </div>
    <!-- 对方技能栏 -->
    <div id="opponent-skills-bar"></div>
    <!-- 我方技能栏 -->
    <div id="skills-bar"></div>
    <!-- 输入区域 -->
    <div id="input-keypad-container">
      <div id="input-display" class="empty">等待输入</div>
      <div id="keypad">
        <button class="key-btn" data-value="9">9</button>
        <button class="key-btn" data-value="8">8</button>
        <button class="key-btn" data-value="7">7</button>
        <button class="key-btn func" data-action="back">⌫</button>
        <button class="key-btn" data-value="6">6</button>
        <button class="key-btn" data-value="5">5</button>
        <button class="key-btn" data-value="4">4</button>
        <button class="key-btn func" data-action="clear">C</button>
        <button class="key-btn" data-value="3">3</button>
        <button class="key-btn" data-value="2">2</button>
        <button class="key-btn" data-value="1">1</button>
        <button class="key-btn confirm" data-action="confirm">确定</button>
        <button class="key-btn" data-value="0">0</button>
        <button class="key-btn" data-value="00">00</button>
        <button class="key-btn" data-value="000">000</button>
      </div>
      <button id="surrender-btn">🏳️ 认输</button>
      <button id="game-over-btn">返回主菜单</button>
      <button id="rematch-btn">🔄 再来一局</button>
    </div>
    <!-- 我方区域 -->
    <div class="player-area" id="me-area">
      <div class="highlight" id="me-highlight">
        <div class="life-dots" id="me-lives"></div>
        <div class="avatar" id="me-avatar">🙂</div>
        <div class="name-tag" id="me-name">我</div>
      </div>
    </div>
  </div>
  <!-- 技能选择覆盖层 -->

/* ==================== PeerJS 多服务器自动切换 ==================== */
function createPeer(id, onOpen, onError) {
  if (typeof Peer === 'undefined') { onError('PeerJS库未加载'); return; }
  function tryServer(idx) {
    if (idx >= PEER_SERVERS.length) { onError('所有信令服务器均不可用'); return; }
    const server = PEER_SERVERS[idx];
    setConnStatus('正在连接信令服务器 ' + (idx+1) + '/' + PEER_SERVERS.length + '...');
    try {
      if (G.peer) { try { G.peer.destroy(); } catch(e) {} }
      G.peer = new Peer(id, { debug:0, host:server.host, port:server.port, path:server.path, ssl:server.ssl, secure:true, iceServers:ICE_SERVERS });
      let opened = false;
      G.peer.on('open', function(peerId) { if(opened) return; opened=true; setConnStatus('已连接到信令服务器'); onOpen(peerId); });
      G.peer.on('error', function(err) { if(opened) return; if(err.type==='unavailable-id'||err.type==='peer-unavailable'){ onError(err.type+': '+id); } else { tryServer(idx+1); } });
      setTimeout(function(){ if(!opened) tryServer(idx+1); }, 8000);
    } catch(e) { tryServer(idx+1); }
  }
  tryServer(0);
}

/* ==================== 连接重试机制 ==================== */
function attemptJoinRoom(code, retryCount) {
  retryCount = retryCount || 0;
  const MAX_RETRIES = 8;
  setConnStatus('正在连接房间 ' + code + '... (尝试 ' + (retryCount+1) + '/' + MAX_RETRIES + ')');
  if (retryCount >= MAX_RETRIES) { setConnStatus('连接失败'); lobbyMessage.textContent = '❌ 连接超时'; return; }
  createPeer('guest-' + code + '-' + retryCount, function(peerId) {
    setConnStatus('已连接信令服务器，正在连接Host...');
    try {
      const conn = G.peer.connect('bomb-' + code, { reliable: true });
      setupConnection(conn);
      setTimeout(function(){ if(G.conn && !G.conn.open) attemptJoinRoom(code, retryCount+1); }, 3000);
    } catch(e) { setTimeout(function(){ attemptJoinRoom(code, retryCount+1); }, 1500); }
  }, function(errMsg) { setConnStatus('信令服务器连接失败'); lobbyMessage.textContent='❌ 无法连接到信令服务器'; });
}

/* ==================== 隐私遮罩（本地模式） ==================== */
const Privacy = {
  _onDone:null, _state:'idle',
  isLocal: function(){ return G.mode.includes('local'); },
  handoff: function(playerName, onDone){
    if(!this.isLocal()){ if(onDone) onDone(); return; }
    this._onDone=onDone; this._state='handoff';
    privacyTitle.textContent='🔒 请将设备交给 '+playerName;
    privacyContent.innerHTML='';
    privacyScreen.classList.remove('revealed');
    privacyScreen.classList.add('active');
  },
  reveal: function(playerName, label, resultText, onDone){
    if(!this.isLocal()){ if(onDone) onDone(); return; }
    this._onDone=onDone||null; this._state='reveal-hidden';
    privacyTitle.textContent='🔒 '+playerName+' 的私密信息';
    privacyContent.innerHTML='<div class="privacy-label">'+label+'</div><div class="privacy-result">'+resultText+'</div><button class="privacy-hide-btn" id="privacy-hide">✅ 记住了，点击隐藏</button>';
    privacyScreen.classList.remove('revealed');
    privacyScreen.classList.add('active');
  },
  _handleClick: function(e){
    if(e.target.id==='privacy-hide'){
      e.stopPropagation();
      privacyScreen.classList.remove('revealed');
      privacyContent.innerHTML='<div class="p-sub" style="color:#666;font-size:0.8rem;">点击屏幕关闭</div>';
      this._state='reveal-done';
      return;
    }
    if(this._state==='handoff'){
      privacyScreen.classList.remove('active');
      this._state='idle';
      const cb=this._onDone; this._onDone=null;
      if(cb) cb();
    } else if(this._state==='reveal-hidden'){
      privacyScreen.classList.add('revealed');
      this._state='reveal-shown';
    } else if(this._state==='reveal-done'){
      privacyScreen.classList.remove('active');
      this._state='idle';
      const cb=this._onDone; this._onDone=null;
      if(cb) cb();
    }
  },
  hide: function(){
    privacyScreen.classList.remove('active','revealed');
    privacyContent.innerHTML='';
    this._state='idle'; this._onDone=null;
  }
};
privacyScreen.addEventListener('click', function(e){ Privacy._handleClick(e); });

  if(G.playerInput===''){ inputDisplay.textContent='等待输入'; inputDisplay.classList.add('empty'); }
  else { inputDisplay.textContent=G.playerInput; inputDisplay.classList.remove('empty'); }
}
function updateTurnIndicator(){
  turnIndicator.classList.remove('turn-me','turn-opponent');
  const cur=getCurrentPlayer(), me=getMyPlayer();
  if(Privacy.isLocal()){
    turnIndicator.textContent=(cur.id==='p1'?'🔵 ':'🔴 ')+cur.name+' 的回合';
    turnIndicator.classList.add(cur.id==='p1'?'turn-me':'turn-opponent');
  } else if(cur.id===me.id){
    turnIndicator.textContent='👇 我的回合';
    turnIndicator.classList.add('turn-me');
  } else {
    turnIndicator.textContent=G.mode.includes('ai')?'🤖 AI思考中...':'👆 对方回合...';
    turnIndicator.classList.add('turn-opponent');
  }
  setKeypadEnabled(isMyTurn() && !G.processing && G.active);
  renderSkills();
}
function setKeypadEnabled(enabled){
  keypadButtons.forEach(btn=>{
    btn.disabled=!enabled;
  });
}
function showExplosion(target){
  const area=target==='me'?meHighlight:opponentHighlight;
  area.classList.add('shake');
  setTimeout(()=>area.classList.remove('shake'),500);
  const ex=document.createElement('div');
  ex.className='explosion'; ex.textContent='💥';
  ex.style.left='50%'; ex.style.top='50%'; ex.style.transform='translate(-50%,-50%)';
  area.appendChild(ex);
  setTimeout(()=>ex.remove(),700);
}
function renderSkills(){
  skillsBar.innerHTML='';
  if(!G.isSkillMode || battleArea.style.display==='none'){
    skillsBar.style.display='none';
    renderOpponentSkills();
    return;
  }
  skillsBar.style.display='flex';
  const owner=Privacy.isLocal()?getCurrentPlayer():getMyPlayer();
  if(!owner||!owner.skills) { renderOpponentSkills(); return; }
  const isLocked=owner.lock;
  const canAct=G.active && !G.processing && owner.id===G.currentPlayer && !isLocked;
  owner.skills.forEach(skill=>{
    const btn=document.createElement('button');
    btn.className='skill-btn';
    const cd=owner.cooldowns[skill.id]||0;
    if(cd>0){ btn.textContent=skill.name+' ('+cd+')'; btn.disabled=true; }
    else if(isLocked){ btn.textContent='🚫'+skill.name; btn.disabled=true; }
    else {
      btn.textContent=skill.name;
      btn.disabled=!canAct;
      if(canAct) btn.classList.add('ready');
    }
    btn.addEventListener('click',function(){ useSkill(skill.id); });
    skillsBar.appendChild(btn);
  });
  renderOpponentSkills();
}
function renderOpponentSkills(){
  opponentSkillsBar.innerHTML='';
  if(!G.isSkillMode || battleArea.style.display==='none' || Privacy.isLocal()){
    opponentSkillsBar.style.display='none';
    return;
  }
  const opp=getMyOpponent();
  if(!opp||!opp.skills||opp.skills.length===0){
    opponentSkillsBar.style.display='none';
    return;
  }
  opponentSkillsBar.style.display='flex';
  opp.skills.forEach(skill=>{
    const tag=document.createElement('span');
    tag.className='opp-skill-tag';
    const cd=opp.cooldowns[skill.id]||0;
    tag.textContent=opp.name+'：'+skill.name+(cd>0?' ('+cd+')':'');
    opponentSkillsBar.appendChild(tag);
  });
}
function reduceCooldowns(playerId){
  const p=getPlayer(playerId);
  Object.keys(p.cooldowns).forEach(k=>{ if(p.cooldowns[k]>0) p.cooldowns[k]--; });
  renderSkills();
}

/* ==================== 游戏流程控制 ==================== */
function readSetupInputs(isRemote){
  const minEl=isRemote?remoteMinInput:minInput;
  const maxEl=isRemote?remoteMaxInput:maxInput;
  const hpEl=isRemote?remoteHpInput:hpInput;
  let mn=parseInt(minEl.value)||1, mx=parseInt(maxEl.value)||100, hp=parseInt(hpEl.value)||5;
  if(mn<1) mn=1;
  if(mx<mn+9) mx=mn+9;
  hp=Math.max(1,Math.min(15,hp));
  G.minVal=mn; G.maxVal=mx;
  getPlayer('p1').maxHP=hp; getPlayer('p2').maxHP=hp;
}
function resetGameState(){
  G.active=true; G.processing=false;
  G.low=G.minVal; G.high=G.maxVal;
  G.bombNumber=Math.floor(Math.random()*(G.maxVal-G.minVal+1))+G.minVal;
  G.playerInput='';
  G.currentPlayer=Math.random()<0.5?'p1':'p2';
  G.pendingSkillSelect=null; G.pendingSkillOptions=null;
  skillSelectPhase=null; G.hostSkillComplete=null;
  clearHostTimeout(); clearAiTimeouts();
  ['p1','p2'].forEach(id=>{
    const p=G.players[id];
    p.hp=p.maxHP;
    p.shield=false;p.double=false;p.triple=false;p.lifesteal=false;p.rebirth=false;
    p.speed=false;p.skipNext=false;p.lock=false;p.reflect=false;p.pierce=false;
    p.blind=false;p.trapNumber=null;
    p.skills=[];p.cooldowns={};
  });
}
function startNewRound(){
  G.low=G.minVal; G.high=G.maxVal;
  G.bombNumber=Math.floor(Math.random()*(G.maxVal-G.minVal+1))+G.minVal;
  G.playerInput=''; G.processing=false;
  updateRange(); updateInputDisplay();
  messageDisplay.textContent='💥 炸弹重置！新的一轮！';
  renderSkills();
  updateTurnIndicator();
  if(Privacy.isLocal()){
    Privacy.handoff(getCurrentPlayer().name, function(){
      renderSkills(); updateTurnIndicator(); syncIfRemote();
    });
  }
  if(G.mode.includes('ai')&&G.currentPlayer==='p2'&&G.active) scheduleAi(aiTurn,900);
  syncIfRemote();
}
function endGame(){
  G.active=false; G.processing=false;
  G.pendingSkillSelect=null; G.pendingSkillOptions=null;
  skillSelectPhase=null; G.hostSkillComplete=null;
  skillSelectOverlay.classList.remove('active','rotated');
  Privacy.hide();
  if(G.skillTimer){ clearInterval(G.skillTimer); G.skillTimer=null; }
  clearHostTimeout(); clearAiTimeouts();
  if(Privacy.isLocal()){
    const p1=getPlayer('p1'), p2=getPlayer('p2');
    if(p1.hp<=0&&p2.hp<=0) messageDisplay.textContent='🤝 平局！';
    else if(p1.hp<=0) messageDisplay.textContent='🎉 '+p2.name+' 获胜！';
    else messageDisplay.textContent='🎉 '+p1.name+' 获胜！';
  } else {
    const me=getMyPlayer(), opp=getMyOpponent();
    if(me.hp<=0&&opp.hp<=0) messageDisplay.textContent='🤝 平局！';
    else if(me.hp<=0) messageDisplay.textContent='😵 我输了...';
    else messageDisplay.textContent='🎉 我赢了！';
  }
  setKeypadEnabled(false);
  surrenderBtn.style.display='none';
  gameOverBtn.style.display='block';
  if(G.mode.includes('remote')){
    if(G.isHost) rematchBtn.style.display='block';
  } else {
    rematchBtn.style.display='block';
  }
  renderSkills();
  syncIfRemote();
}
function initGame(){
  resetGameState();
  if(G.mode.includes('remote')&&!G.isHost){
    showBattleArea();
    getPlayer('p1').name='Host'; getPlayer('p1').avatar='🙂';
    getPlayer('p2').name='我'; getPlayer('p2').avatar='🙂';

  if(Privacy.isLocal()){

    getPlayer('p2').name='红方'; getPlayer('p2').avatar='🔴';
    roomInfo.textContent='📱 本地双人';
  } else if(G.mode.includes('ai')){
    getPlayer('p1').name='我'; getPlayer('p1').avatar='🙂';
    getPlayer('p2').name='AI'; getPlayer('p2').avatar='🤖';

  } else if(G.mode.includes('remote')){

    getPlayer('p2').name='Guest'; getPlayer('p2').avatar='🙂';

  }

  updateTurnIndicator();

}

/* ==================== 技能选择流程 ==================== */
function startRoundSkillSelect(){
  if(!G.isSkillMode||!G.active){ startNewRound(); return; }
  G.processing=true;
  setKeypadEnabled(false);
  if(G.mode.includes('remote')){
    if(G.isHost){
      const p1Options = getRandomSkills(3).map(s=>s.id);
      const p2Options = getRandomSkills(3).map(s=>s.id);
      G.pendingSkillOptions = p1Options;
      G.pendingSkillSelect = 'p1';
      syncIfRemote();
      showSkillSelectWithCallback('p1', function(){
        G.pendingSkillOptions = p2Options;
        G.pendingSkillSelect = 'p2';
        syncIfRemote();
        startHostTimeout('p2', function(){
          G.pendingSkillSelect = null;
          G.pendingSkillOptions = null;
          startNewRound();
        });
      });
    } else {
      G.pendingSkillSelect = 'p2';
      setKeypadEnabled(false);
    }
  } else {
    const first=G.currentPlayer;
    const second=getOpponentPlayer(first).id;
    skillSelectPhase=first;
    triggerSkillSelectForPlayer(first, function(){
      if(!G.active) return;
      skillSelectPhase=second;
      triggerSkillSelectForPlayer(second, function(){
        skillSelectPhase=null;
        startNewRound();
      });
    });
  }
}
function triggerSkillSelectForPlayer(playerId, onComplete){
  if(!G.active){ onComplete(); return; }
  if(G.mode.includes('ai')&&playerId==='p2'){
    aiSelectSkillWithCallback(onComplete);
  } else {
    showSkillSelectWithCallback(playerId, onComplete);
  }
}
function showSkillSelectWithCallback(forPlayerId, onComplete){
  const player=getPlayer(forPlayerId);
  const options=getRandomSkills(3);
  if(G.mode.includes('remote')&&G.isHost){
    G.pendingSkillOptions=options.map(s=>s.id);
    G.pendingSkillSelect=forPlayerId;
  }
  function actuallyShow(){
    skillSelectGrid.innerHTML='';
    skillSelectTitle.textContent=player.name+' 选择技能';
    let done=false;
    function doSelect(skill){
      if(done) return; done=true;
      if(G.skillTimer){ clearInterval(G.skillTimer); G.skillTimer=null; }
      clearHostTimeout();
      player.skills=[skill];
      player.cooldowns={};
      skillSelectOverlay.classList.remove('active','rotated');
      Privacy.hide();
      renderSkills();
      announceOpponentSkill(forPlayerId, skill.name);
      if(Privacy.isLocal()){
        Privacy.reveal(player.name, '你选择了', skill.name+'<br><span style="font-size:0.7rem;color:#aaa;">'+skill.desc+'</span>', function(){
          if(onComplete) onComplete();
        });
      } else {
        if(onComplete) onComplete();
      }
    }
    options.forEach(skill=>{
      const card=document.createElement('div');
      card.className='skill-select-card';
      card.innerHTML='<div class="skill-icon">'+skill.name.split(' ')[0]+'</div><div class="skill-name">'+skill.name+'</div><div class="skill-desc">'+skill.desc+'</div>';
      card.addEventListener('click',function(){ doSelect(skill); });
      skillSelectGrid.appendChild(card);
    });
    if(Privacy.isLocal()&&forPlayerId==='p2') skillSelectOverlay.classList.add('rotated');
    else skillSelectOverlay.classList.remove('rotated');
    skillSelectOverlay.classList.add('active');
    G.pendingSkillSelect=forPlayerId;
    G.processing=true;
    setKeypadEnabled(false);
    G.skillTimerCount=30;
    skillTimerEl.textContent=G.skillTimerCount;
    if(G.skillTimer) clearInterval(G.skillTimer);
    G.skillTimer=setInterval(function(){
      G.skillTimerCount--;
      skillTimerEl.textContent=G.skillTimerCount;
      if(G.skillTimerCount<=0){
        clearInterval(G.skillTimer); G.skillTimer=null;
        doSelect(options[Math.floor(Math.random()*options.length)]);
      }
    },1000);
  }
  if(Privacy.isLocal()){
    Privacy.handoff(player.name+'（选择技能）', actuallyShow);
  } else {
    actuallyShow();
  }
}
function aiSelectSkillWithCallback(onComplete){
  const options=getRandomSkills(3);
  let skill;
  if(G.aiLevel>=2) skill=aiChooseSkill(getPlayer('p2'),getPlayer('p1'),options)||options[Math.floor(Math.random()*options.length)];
  else skill=options[Math.floor(Math.random()*options.length)];
  getPlayer('p2').skills=[skill];
  getPlayer('p2').cooldowns={};
  G.processing=true;
  messageDisplay.textContent='🤖 AI 正在选择技能...';
  scheduleAi(function(){
    if(!G.active){ if(onComplete) onComplete(); return; }
    announceOpponentSkill('p2',skill.name);
    renderSkills();
    if(onComplete) onComplete();
  },900);
}
function startHostTimeout(playerId, onComplete){
  clearHostTimeout();
  G.hostTimeout=setTimeout(function(){
    if(G.active&&G.pendingSkillSelect===playerId&&G.isHost){
      const player=getPlayer(playerId);
      let opts=[];
      if(G.pendingSkillOptions&&G.pendingSkillOptions.length>0) opts=G.pendingSkillOptions.map(getSkillById).filter(s=>s);
      if(opts.length===0) opts=getRandomSkills(1);
      const rs=opts[Math.floor(Math.random()*opts.length)];
      player.skills=[rs]; player.cooldowns={};
      skillSelectOverlay.classList.remove('active','rotated');
      Privacy.hide();
      if(G.skillTimer){ clearInterval(G.skillTimer); G.skillTimer=null; }
      G.pendingSkillSelect=null; G.pendingSkillOptions=null;
      G.hostSkillComplete=null;
      messageDisplay.textContent=player.name+' 超时，自动选择了技能';
      renderSkills();
      syncIfRemote();
      if(onComplete) onComplete();
    }
  },30000);
}
function showSkillSelectWithOptions(forPlayerId, optionIds){
  const player=getPlayer(forPlayerId);
  let options=(optionIds&&optionIds.length>0)?optionIds.map(getSkillById).filter(s=>s):getRandomSkills(3);
  if(options.length===0) options=getRandomSkills(3);

    card.addEventListener('click',function(){ doSelect(skill); });
    skillSelectGrid.appendChild(card);
  });

  skillSelectOverlay.classList.add('active');

  setKeypadEnabled(false);
  G.skillTimerCount=30;
  skillTimerEl.textContent=G.skillTimerCount;
  if(G.skillTimer) clearInterval(G.skillTimer);
  G.skillTimer=setInterval(function(){
    G.skillTimerCount--;
    skillTimerEl.textContent=G.skillTimerCount;
    if(G.skillTimerCount<=0){
      clearInterval(G.skillTimer); G.skillTimer=null;
      doSelect(options[Math.floor(Math.random()*options.length)]);
    }
  },1000);
}

/* ==================== 猜测处理 ==================== */
function processGuess(guess, isSkillAttack, guesserId){
  if(!G.active||G.processing) return;
  const guesser=guesserId?getPlayer(guesserId):getCurrentPlayer();
  const defender=getOpponentPlayer(guesser.id);
  if(!isSkillAttack){
    if(isNaN(guess)||guess<G.low||guess>G.high){
      messageDisplay.textContent='⚠️ 请输入 '+G.low+'~'+G.high+' 之间的数字';
      G.playerInput=''; updateInputDisplay();
      if(!(G.mode.includes('ai')&&guesser.id==='p2')) setKeypadEnabled(isMyTurn()&&!G.processing);
      return;
    }
  }
  let isHit=(guess===G.bombNumber)||isSkillAttack;
  if(!isHit && defender.trapNumber !== null && guess === defender.trapNumber){
    isHit = true;
  }
  let guesserName;
  if(Privacy.isLocal()) guesserName=guesser.name;
  else guesserName=guesser.id===getMyPlayer().id?'我':(G.mode.includes('ai')&&guesser.id==='p2'?'AI':'对方');
  messageDisplay.textContent=isSkillAttack?guesserName+' 使用了自爆！':guesserName+' 猜了 '+guess;
  G.processing=true;
  setKeypadEnabled(false);
  const delay=Privacy.isLocal()?800:500;
  setTimeout(function(){
    if(!G.active) return;
    if(isHit){
      let damage=1;
      if(guesser.double){ damage=2; guesser.double=false; }
      if(guesser.triple){ damage=3; guesser.triple=false; }
      if(defender.shield && !guesser.pierce){
        defender.shield=false;
        messageDisplay.textContent='🛡️ '+defender.name+' 的护盾抵挡了伤害！';
      } else if(defender.reflect && !isSkillAttack && !guesser.pierce){
        defender.reflect=false;
        guesser.hp-=damage;
        const targetArea = Privacy.isLocal() ? (guesser.id===G.currentPlayer?'me':'opponent') : (guesser.id===getMyPlayer().id?'me':'opponent');
        showExplosion(targetArea);
        messageDisplay.textContent='🪞 伤害被反射！'+guesserName+' -'+damage+'血';
        renderPlayers();
        guesser.pierce=false;
        if(getPlayer('p1').hp<=0||getPlayer('p2').hp<=0){ endGame(); return; }
        afterHitSkillPhase();
        return;
      } else {
        defender.hp-=damage;
        if(guesser.lifesteal){ guesser.hp=Math.min(guesser.maxHP,guesser.hp+1); guesser.lifesteal=false; }
        if(defender.rebirth&&defender.hp<=0){
          defender.hp=2; defender.rebirth=false;
          messageDisplay.textContent='🕊️ '+defender.name+' 重生！以2血复活';
        } else {
          const targetArea = Privacy.isLocal() ? 'opponent' : (defender.id===getMyPlayer().id?'me':'opponent');
          showExplosion(targetArea);
          messageDisplay.textContent='💥 踩中炸弹 '+G.bombNumber+'！'+defender.name+' -'+damage+'血';
        }
      }
      guesser.pierce=false;
      defender.trapNumber=null;
      renderPlayers();
      getPlayer('p1').lock=false; getPlayer('p2').lock=false;
      if(getPlayer('p1').hp<=0||getPlayer('p2').hp<=0){ endGame(); return; }
      afterHitSkillPhase();
    } else {
      if(guess<G.bombNumber){ G.low=guess+1; messageDisplay.textContent='📈 炸弹比 '+guess+' 大'; }
      else { G.high=guess-1; messageDisplay.textContent='📉 炸弹比 '+guess+' 小'; }
      if(defender.trapNumber !== null && (defender.trapNumber < G.low || defender.trapNumber > G.high)){
        defender.shield = true;
        messageDisplay.textContent += ' 🪤 陷阱数字被跳过，'+defender.name+' 获得护盾！';
        defender.trapNumber = null;
      }
      updateRange();
      G.playerInput=''; updateInputDisplay();
      if(guesser.triple){
        guesser.triple=false;
        guesser.hp-=1;
        messageDisplay.textContent+=' 💥 三倍落空，自己-1血！';
        renderPlayers();
        if(guesser.hp<=0){
          if(guesser.rebirth){
            guesser.hp=2; guesser.rebirth=false;
            messageDisplay.textContent='🕊️ 重生触发！以2血复活';
            renderPlayers();
          } else {
            endGame();
            return;
          }
        }
      }
      if(guesser.speed){
        guesser.speed=false;
        messageDisplay.textContent+='（🏃加速：可再猜一次）';
        G.processing=false;
        renderSkills();
        if(G.mode.includes('ai')&&guesser.id==='p2'){
          setKeypadEnabled(false);
          scheduleAi(aiGuess,900);
        } else {
          setKeypadEnabled(isMyTurn()&&!G.processing);
        }
        syncIfRemote();
        return;
      }
      switchTurn();
    }
  },delay);
}
function afterHitSkillPhase(){
  if(G.isSkillMode&&!(G.mode.includes('remote')&&!G.isHost)){
    startRoundSkillSelect();
  } else if(!G.isSkillMode){
    startNewRound();
  }
  syncIfRemote();
}
function switchTurn(){
  const current=getCurrentPlayer();
  const opponent=getOpponentPlayer(current.id);
  current.blind=false;
  current.double=false;
  current.triple=false;
  current.lifesteal=false;
  current.pierce=false;
  current.speed=false;
  current.shield=false;
  current.reflect=false;
  G.playerInput=''; updateInputDisplay();
  reduceCooldowns(current.id);
  function doSwitch(){
    if(opponent.skipNext){
      opponent.skipNext=false;
      opponent.blind=false;
      messageDisplay.textContent='🕐 '+opponent.name+' 被暂停，跳过回合！';
      G.processing=false;
      G.playerInput=''; updateInputDisplay();
      renderSkills(); updateTurnIndicator();
      if(G.mode.includes('ai')&&G.currentPlayer==='p2') scheduleAi(aiTurn,900);
      syncIfRemote();
      return;
    }
    G.currentPlayer=opponent.id;
    G.processing=false;
    renderSkills(); updateTurnIndicator(); updateRange();
    if(G.mode.includes('ai')&&G.currentPlayer==='p2') scheduleAi(aiTurn,900);
    syncIfRemote();
  }
  if(Privacy.isLocal()){
    Privacy.handoff(opponent.name, doSwitch);
  } else {
    doSwitch();
  }
}

/* ==================== 技能使用 ==================== */
function useSkill(skillId, playerId){
  if(!G.active||G.processing) return;
  const user=playerId?getPlayer(playerId):(Privacy.isLocal()?getCurrentPlayer():getMyPlayer());
  if(user.id!==G.currentPlayer) return;
  if(G.mode.includes('remote')&&!G.isHost&&!playerId){
    if(G.conn){
      G.conn.send({type:'action',action:'skill',playerId:user.id,skillId:skillId});
      G.processing=true;
      setKeypadEnabled(false);
    }
    return;
  }
  const skill=getSkillById(skillId);
  if(!skill) return;
  const cd=user.cooldowns[skill.id]||0;
  if(cd>0) return;
  if(user.lock){ messageDisplay.textContent='🚫 技能被封锁，无法使用！'; return; }
  const opponent=getOpponentPlayer(user.id);
  let userName;
  if(Privacy.isLocal()) userName=user.name;
  else userName=user.id===getMyPlayer().id?'我':(G.mode.includes('ai')?'AI':'对方');
  user.cooldowns[skillId]=skill.cooldown;
  switch(skillId){
    case 'detect':
      showPrivateInfo(userName,'📡探测','炸弹是'+(G.bombNumber%2===0?'偶数':'奇数')); break;
    case 'peek': {
      const s=String(G.bombNumber);
      const pos=Math.random()<0.5?'个位':'最高位';
      const val=pos==='个位'?s[s.length-1]:s[0];
      showPrivateInfo(userName,'🔍透视','炸弹的'+pos+'是 '+val); break;
    }
    case 'digitsum': {
      const sum=String(G.bombNumber).split('').reduce((a,b)=>a+parseInt(b),0);
      showPrivateInfo(userName,'🧮数字和','各位数字之和为 '+sum); break;
    }
    case 'prime':
      showPrivateInfo(userName,'🔢质数','炸弹'+(isPrime(G.bombNumber)?'是':'不是')+'质数'); break;
    case 'magnitude':
      showPrivateInfo(userName,'📏量级','炸弹是 '+String(G.bombNumber).length+' 位数'); break;
    case 'modulo':
      showPrivateInfo(userName,'➗取模','炸弹 mod 3 = '+(G.bombNumber%3)); break;
    case 'binary': {
      if(G.low>=G.high){ messageDisplay.textContent='⚠️ 范围无法再缩小'; delete user.cooldowns[skillId]; renderSkills(); return; }
      const mid=Math.floor((G.low+G.high)/2);
      if(G.bombNumber<=mid) G.high=mid; else G.low=mid+1;
      updateRange();
      messageDisplay.textContent='✂️ '+userName+'二分！范围→'+G.low+'~'+G.high;
      break;
    }
    case 'move': {
      const dir=Math.random()<0.5?1:-1;
      const old=G.bombNumber;
      G.bombNumber=Math.max(G.low,Math.min(G.high,G.bombNumber+dir*5));
      messageDisplay.textContent='🚚 '+userName+'移动！炸弹'+(G.bombNumber>old?'向上':(G.bombNumber<old?'向下':'(已到边界未动)'))+'移动';
      break;
    }
    case 'shuffle':
      G.bombNumber=Math.floor(Math.random()*(G.high-G.low+1))+G.low;
      messageDisplay.textContent='🔀 '+userName+'洗牌！炸弹位置重置';
      break;
    case 'shrink':
      G.low=Math.min(G.low+5,G.bombNumber);
      G.high=Math.max(G.high-5,G.bombNumber);
      updateRange();
      messageDisplay.textContent='🔽 '+userName+'收缩！范围→'+G.low+'~'+G.high;
      break;
    case 'expand':
      G.low=Math.max(G.minVal,G.low-10);
      G.high=Math.min(G.maxVal,G.high+10);
      updateRange();
      messageDisplay.textContent='🔼 '+userName+'扩张！范围→'+G.low+'~'+G.high;
      break;
    case 'suicide':
      renderSkills();
      processGuess(G.bombNumber,true,user.id);
      return;
    case 'double':
      user.double=true;
      messageDisplay.textContent='⚡ '+userName+'双倍！踩雷伤害x2已激活';
      break;
    case 'triple':
      user.triple=true;
      messageDisplay.textContent='💥 '+userName+'三倍！踩雷x3，猜错自伤1';
      break;
    case 'gamble': {
      if(Math.random()<0.5){
        opponent.hp=Math.max(0,opponent.hp-1);
        messageDisplay.textContent='🎲 赌博成功！'+opponent.name+' -1血';
      } else {
        user.hp=Math.max(0,user.hp-1);
        messageDisplay.textContent='🎲 赌博失败！'+userName+' -1血';
      }
      renderPlayers();
      if(getPlayer('p1').hp<=0||getPlayer('p2').hp<=0){ endGame(); return; }
      break;
    }
    case 'lifesteal':
      user.lifesteal=true;
      messageDisplay.textContent='🌙 '+userName+'吸血已激活';
      break;
    case 'pierce':
      user.pierce=true;
      messageDisplay.textContent='🗡️ '+userName+'穿透！本回合无视护盾';
      break;
    case 'shield':
      user.shield=true;
      messageDisplay.textContent='🛡️ '+userName+'护盾已激活';
      break;
    case 'heal':
      user.hp=Math.min(user.maxHP,user.hp+1);
      renderPlayers();
      messageDisplay.textContent='💊 '+userName+'治疗 +1血 ('+user.hp+'/'+user.maxHP+')';
      break;
    case 'bigheal':
      user.hp=Math.min(user.maxHP,user.hp+2);
      renderPlayers();
      messageDisplay.textContent='💖 '+userName+'大治疗 +2血 ('+user.hp+'/'+user.maxHP+')';
      break;
    case 'rebirth':
      user.rebirth=true;
      messageDisplay.textContent='🕊️ '+userName+'重生已激活';
      break;
    case 'reflect':
      user.reflect=true;
      messageDisplay.textContent='🪞 '+userName+'反射已激活';
      break;
    case 'speed':
      user.speed=true;
      messageDisplay.textContent='🏃 '+userName+'加速！本回合可猜2次';
      break;
    case 'pause':
      opponent.skipNext=true;
      messageDisplay.textContent='🕐 '+userName+'暂停！'+opponent.name+'下回合被跳过';
      break;
    case 'lock':
      opponent.lock=true;
      messageDisplay.textContent='🚫 '+userName+'封锁！'+opponent.name+'禁用技能直到爆炸';
      break;
    case 'blind':
      opponent.blind=true;
      messageDisplay.textContent='🙈 '+userName+'致盲！'+opponent.name+'下回合看不到范围';
      break;
    case 'swap': {
      const t=user.hp; user.hp=opponent.hp; opponent.hp=t;
      renderPlayers();
      messageDisplay.textContent='🔄 '+userName+'交换生命！'+user.name+':'+user.hp+' '+opponent.name+':'+opponent.hp;
      if(getPlayer('p1').hp<=0||getPlayer('p2').hp<=0){ endGame(); return; }
      break;
    }
    case 'trap': {
      const trapNum = Math.floor(Math.random()*(G.high-G.low+1))+G.low;
      user.trapNumber = trapNum;
      showPrivateInfo(userName,'🪤陷阱','陷阱数字是 '+trapNum);
      break;
    }
    case 'insight': {
      const insightNum = Math.floor(Math.random()*(G.high-G.low+1))+G.low;
      const dist = Math.abs(G.bombNumber - insightNum);
      showPrivateInfo(userName,'🕯️洞察','数字 '+insightNum+' 与炸弹距离为 '+dist);
      break;
    }
  }
  renderSkills();
  updateTurnIndicator();
  syncIfRemote();
}

/* ==================== AI逻辑 ==================== */
function aiChooseSkill(ai, human, options){
  const scores=options.map(function(s){
    let sc=Math.random()*10;
    if(ai.hp<=2){
      if(['heal','bigheal','shield','rebirth'].indexOf(s.id)>=0) sc+=100;
      if(s.id==='swap'&&human.hp>ai.hp) sc+=120;
    }
    if(s.id==='suicide'&&human.hp<=1) sc+=80;
    if(['detect','peek','binary'].indexOf(s.id)>=0) sc+=30;
    if(['pause','lock'].indexOf(s.id)>=0) sc+=40;
    if(s.id==='double'||s.id==='triple') sc+=25;
    return {s:s,sc:sc};
  });
  scores.sort(function(a,b){return b.sc-a.sc;});
  return scores[0].s;
}
function aiTurn(){
  if(!G.active||G.processing||G.currentPlayer!=='p2'||!G.mode.includes('ai')) return;
  G.processing=true;
  setKeypadEnabled(false);
  messageDisplay.textContent='🤖 AI思考中...';
  const ai=getPlayer('p2'), human=getPlayer('p1');
  if(G.isSkillMode&&ai.skills.length>0&&!ai.lock){
    const skill=ai.skills[0];
    const cd=ai.cooldowns[skill.id]||0;
    if(cd<=0){
      let useProb=0;
      if(G.aiLevel===1) useProb=0.3;
      else if(G.aiLevel===2) useProb=0.6;
      else useProb=0.85;
      if(Math.random()<useProb){
        const shouldUse=(
          (['heal','bigheal'].indexOf(skill.id)>=0&&ai.hp<=2)||
          (skill.id==='shield'&&ai.hp<=3)||
          (skill.id==='suicide'&&human.hp<=1)||
          ['detect','peek','binary','pause','lock','double','gamble','digitsum','prime','magnitude','modulo','shrink','insight','trap'].indexOf(skill.id)>=0
        );
        if(shouldUse||Math.random()<0.4){
          useSkill(skill.id,'p2');
          if(G.active&&G.processing&&G.currentPlayer==='p2'){
            scheduleAi(aiGuess,1000);
          }
          return;
        }
      }
    }
  }
  scheduleAi(aiGuess,900);
}
function aiGuess(){
  if(!G.active||G.processing||G.currentPlayer!=='p2'||!G.mode.includes('ai')) return;
  const ai=getPlayer('p2');
  let guess;
  const range=G.high-G.low+1;
  if(G.aiLevel===1){
    guess=Math.floor(Math.random()*range)+G.low;
  } else if(G.aiLevel===2){
    const mid=(G.low+G.high)/2;
    const spread=range*0.25;
    guess=Math.round(mid+(Math.random()*2-1)*spread);
    guess=Math.max(G.low,Math.min(G.high,guess));
  } else {
    guess=Math.floor((G.low+G.high)/2);
  }
  G.playerInput=String(guess);
  updateInputDisplay();
  messageDisplay.textContent='🤖 AI 输入了 '+guess;
  scheduleAi(function(){
    if(!G.active) return;
    G.playerInput='';
    G.processing=false;
    processGuess(guess,false,'p2');
  },700);
}

/* ==================== 远程同步 ==================== */
function syncIfRemote(){
  if(!G.mode.includes('remote')||!G.conn||!G.isHost) return;
  const state={
    active:G.active, minVal:G.minVal, maxVal:G.maxVal,
    low:G.low, high:G.high, currentPlayer:G.currentPlayer,
    playerInput:'', processing:G.processing,
    pendingSkillSelect:G.pendingSkillSelect, pendingSkillOptions:G.pendingSkillOptions,
    message:messageDisplay.textContent,
    p1:deepClone(G.players.p1), p2:deepClone(G.players.p2)
  };
  try{ G.conn.send({type:'sync',state:state}); }catch(e){}
}
function applySync(state){
  if(!state) return;
  G.active=state.active;
  G.low=state.low; G.high=state.high;
  G.currentPlayer=state.currentPlayer;
  G.processing=state.processing;
  G.pendingSkillSelect=state.pendingSkillSelect;
  G.pendingSkillOptions=state.pendingSkillOptions;
  G.players.p1 = deepClone(state.p1);
  G.players.p2 = deepClone(state.p2);
  if(battleArea.style.display!=='flex'&&G.active){
    showBattleArea();
    roomInfo.textContent='房间: '+G.roomCode;
    chatToggleBtn.style.display='inline-block';
  }
  if(!G.active && battleArea.style.display!=='flex') return;
  renderPlayers(); updateRange();
  if(state.message) messageDisplay.textContent=state.message;
  updateTurnIndicator();
  renderSkills();
  if(state.pendingSkillSelect==='p2'&&G.myRole==='guest'&&!skillSelectOverlay.classList.contains('active')){
    showSkillSelectWithOptions('p2',state.pendingSkillOptions);
  }
  if(state.pendingSkillSelect==='p1'&&G.myRole==='host'&&!skillSelectOverlay.classList.contains('active')){
    showSkillSelectWithOptions('p1',state.pendingSkillOptions);
  }
  if(!state.pendingSkillSelect&&skillSelectOverlay.classList.contains('active')&&G.myRole==='guest'){
    skillSelectOverlay.classList.remove('active','rotated');
    if(G.skillTimer){ clearInterval(G.skillTimer); G.skillTimer=null; }
  }
  if(!G.active){
    surrenderBtn.style.display='none';
    gameOverBtn.style.display='block';
    rematchBtn.style.display='none';
  }
}
function setupConnection(conn){
  G.conn=conn;
  function handleOpen(){
    roomInfo.textContent='房间: '+G.roomCode;
    if(G.isHost){
      waitingText.textContent='对手已加入！';
      setTimeout(function(){ showRemoteSetup(); },600);
    } else {
      showRemoteWaiting();
      waitingRoomCode.textContent=G.roomCode;
      waitingText.textContent='已连接，等待Host开始游戏...';
      setKeypadEnabled(false);
    }
    startPing();
  }
  if(conn.open){
    handleOpen();
  } else {
    conn.on('open', handleOpen);
  }
  conn.on('data',function(data){
    if(data.type==='ping') return;
    if(data.type==='sync'&&G.myRole==='guest'){
      applySync(data.state);
    } else if(data.type==='action'&&G.isHost){
      handleGuestAction(data);
    } else if(data.type==='start'&&G.myRole==='guest'){
      G.minVal=data.minVal; G.maxVal=data.maxVal;
      G.isSkillMode=data.isSkillMode;
      G.mode=data.isSkillMode?'remote-skill':'remote-normal';
      initGame();
    } else if(data.type==='rematch'&&G.myRole==='guest'){
      messageDisplay.textContent='Host 发起了重赛';
      rematchBtn.disabled=false;
    } else if(data.type==='chat'){
      if(data.text){
        const senderName = data.senderName || '对方';
        addChatMessage(senderName, data.text, 'opponent');
        showChatNotification(senderName, data.text);
        if(chatOverlay.classList.contains('hidden')){
          unreadChatCount++;
          updateChatBadge();
        }
      }
    }
  });
  conn.on('close',function(){
    stopPing();
    roomInfo.textContent='对手已断开';
    setConnStatus('连接已断开');
    chatToggleBtn.style.display='none';
    showCheatToast('⚠️ 对手已断开连接');
    if(G.active){ endGame(); }
    G.conn=null;
  });
  conn.on('error',function(err){
    lobbyMessage.textContent='连接错误: '+err;
  });
}
function handleGuestAction(data){
  if(!G.active) return;
  if(data.action==='guess'&&data.playerId==='p2'&&G.currentPlayer==='p2'&&!G.processing){
    G.playerInput='';
    processGuess(data.guess,false,'p2');
  } else if(data.action==='skill'&&data.playerId==='p2'&&G.currentPlayer==='p2'&&!G.processing){
    useSkill(data.skillId,'p2');
    syncIfRemote();
  } else if(data.action==='skill_select'&&data.playerId==='p2'&&G.pendingSkillSelect==='p2'){
    const skill=getSkillById(data.skillId);
    if(!skill) return;
    const p2=getPlayer('p2');
    p2.skills=[skill]; p2.cooldowns={};
    clearHostTimeout();
    if(G.skillTimer){ clearInterval(G.skillTimer); G.skillTimer=null; }
    skillSelectOverlay.classList.remove('active','rotated');
    G.pendingSkillSelect=null; G.pendingSkillOptions=null;
    messageDisplay.textContent='Guest 选择了技能';
    renderSkills();
    syncIfRemote();
    const cb=G.hostSkillComplete;
    G.hostSkillComplete=null;
    if(cb) cb();
  } else if(data.action==='surrender'){
    messageDisplay.textContent='🏳️ Guest 认输了！';
    getPlayer('p2').hp=0;
    renderPlayers();
    endGame();
    syncIfRemote();
  }
}

/* ==================== 菜单事件 ==================== */
$('normal-mode-btn').addEventListener('click',showNormalSubmenu);
$('skill-mode-btn').addEventListener('click',showSkillSubmenu);
$('normal-back-btn').addEventListener('click',showMainMenu);
$('skill-back-btn').addEventListener('click',showMainMenu);
$('normal-local-btn').addEventListener('click',function(){showSetup('local-normal')});
$('normal-ai-btn').addEventListener('click',function(){showSetup('ai-normal')});
$('skill-local-btn').addEventListener('click',function(){showSetup('local-skill')});
$('skill-ai-btn').addEventListener('click',function(){showSetup('ai-skill')});
$('normal-remote-btn').addEventListener('click',function(){ G.isSkillMode=false; showRemoteLobby(); });
$('skill-remote-btn').addEventListener('click',function(){ G.isSkillMode=true; showRemoteLobby(); });
$('back-menu-btn1').addEventListener('click',showMainMenu);
$('back-menu-btn2').addEventListener('click',showMainMenu);
aiLevelRow.querySelectorAll('.ai-level-btn').forEach(function(b){
  b.addEventListener('click',function(){
    aiLevelRow.querySelectorAll('.ai-level-btn').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    G.aiLevel=parseInt(b.dataset.level);
  });
});
$('start-game-btn').addEventListener('click',function(){
  readSetupInputs(false);
  initGame();
});
surrenderBtn.addEventListener('click',function(){
  if(!G.active) return;
  if(G.mode.includes('remote')&&!G.isHost){
    if(G.conn) G.conn.send({type:'action',action:'surrender',playerId:'p2'});
    messageDisplay.textContent='🏳️ 你认输了';
    G.active=false;
    setKeypadEnabled(false);
    surrenderBtn.style.display='none';
    gameOverBtn.style.display='block';
    return;
  }
  const me=Privacy.isLocal()?getCurrentPlayer():getMyPlayer();
  me.hp=0;
  renderPlayers();
  messageDisplay.textContent='🏳️ '+me.name+' 认输了！';
  endGame();
  syncIfRemote();
});
gameOverBtn.addEventListener('click',function(){
  if(G.mode.includes('remote')){
    cleanupRemote();
  }
  showMainMenu();
});
rematchBtn.addEventListener('click',function(){
  rematchBtn.disabled=true;
  if(G.mode.includes('remote')){
    if(G.isHost&&G.conn&&G.conn.open){
      G.conn.send({type:'rematch'});
      initGame();
    }
  } else {
    initGame();
  }
});

/* ==================== 初始化 ==================== */
showMainMenu();
})();
</script>
</body>
</html>
